name: Maven build

on:
  push:
    branches:
      - main
      - agent/multicompany-hardening
  pull_request:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Compile and package
        env:
          DB_URL: jdbc:postgresql://localhost:5432/employee_management_system
          DB_USERNAME: postgres
          DB_PASSWORD: ci-placeholder-password
          JWT_SECRET: ci-only-placeholder-secret-at-least-32-characters
          COOKIE_SECURE: 'false'
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
