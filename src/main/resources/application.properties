spring.application.name=EmployeeManagementSystem

# Database credentials must be supplied through environment variables.
spring.datasource.url=jdbc:postgresql://localhost:5432/employee_management_system
spring.datasource.username=postgres
spring.datasource.password=#Hello3006

# JDBC is primary. Disable automatic Hibernate schema mutation.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Application authentication uses the existing JWT + JDBC user flow.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Supply a random private signing secret (at least 32 bytes) outside source control.
jwt.secret=mySecretKeyForEmployeeManagementSystem123456

# Set true when deployed over HTTPS.
app.security.cookie-secure=false

# Exact origin allowed for browser requests authenticated by the HttpOnly JWT cookie.
app.security.allowed-origin=http://localhost:8080
