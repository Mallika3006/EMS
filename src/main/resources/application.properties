spring.application.name=EmployeeManagementSystem

# Database credentials must be supplied through environment variables.
spring.datasource.url=jdbc:postgresql://localhost:5432/employee_management_system
spring.datasource.username=postgres
spring.datasource.password=#Hello3006

# JDBC is primary. Disable automatic Hibernate schema mutation.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Application authentication uses the existing JWT + JDBC user flow.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Supply a random private signing secret (at least 32 bytes) outside source control.
jwt.secret=mySecretKeyForEmployeeManagementSystem123456

# Set true when deployed over HTTPS.
app.security.cookie-secure=false

# Exact origin allowed for browser requests authenticated by the HttpOnly JWT cookie.
app.security.allowed-origin=http://localhost:8080

# Password recovery delivery. Email/SMS remain disabled until credentials are configured.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.recovery.email-enabled=${RECOVERY_EMAIL_ENABLED:false}
app.recovery.from=${RECOVERY_FROM:no-reply@ems.local}
app.recovery.sms.enabled=${RECOVERY_SMS_ENABLED:false}
app.recovery.sms.account-sid=${TWILIO_ACCOUNT_SID:}
app.recovery.sms.auth-token=${TWILIO_AUTH_TOKEN:}
app.recovery.sms.from=${TWILIO_FROM_NUMBER:}
