<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Employee Dashboard - StaffSync</title>

    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Employee Dashboard</h1>

    <p>
        Welcome,
        <strong sec:authentication="name"></strong>
    </p>


    <!-- =====================================================
         MY PROFILE
         ===================================================== -->

    <div class="card">

        <h3>My Profile</h3>

        <a href="/my-profile">
            View My Profile
        </a>

    </div>


    <!-- =====================================================
         MY WORK
         ===================================================== -->

    <div class="card">

        <h3>My Work</h3>

        <ul class="dashboard-links">

            <li>
                <a href="/my-attendance">
                    My Attendance
                </a>
            </li>

            <li>
                <a href="/my-leaves">
                    My Leaves
                </a>
            </li>

            <li>
                <a href="/my-payroll">
                    My Payroll
                </a>
            </li>

            <li>
                <a href="/my-projects">
                    My Projects
                </a>
            </li>

            <li>
                <a href="/my-tasks">
                    My Tasks
                </a>
            </li>

        </ul>

    </div>


    <!-- =====================================================
         LOGOUT
         ===================================================== -->

    <form action="/logout" method="post">

        <button type="submit">
            Logout
        </button>

    </form>

</div>

</body>
</html>
