<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Manager Dashboard - StaffSync</title>

    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Manager Dashboard</h1>

    <p>
        Welcome,
        <strong sec:authentication="name"></strong>
    </p>


    <!-- =====================================================
         MY PROFILE
         ===================================================== -->

    <div class="card">

        <h3>My Profile</h3>

        <a href="/manager/profile">
            View My Profile
        </a>

    </div>


    <!-- =====================================================
         MY WORK
         ===================================================== -->

    <div class="card">

        <h3>My Work</h3>

        <ul class="dashboard-links">

            <li>
                <a href="/manager/my-attendance">
                    My Attendance
                </a>
            </li>

            <li>
                <a href="/manager/my-leaves">
                    My Leaves
                </a>
            </li>

            <li>
                <a href="/manager/my-payroll">
                    My Payroll
                </a>
            </li>

        </ul>

    </div>


    <!-- =====================================================
         TEAM & WORK MANAGEMENT
         ===================================================== -->

    <div class="card">

        <h3>Team &amp; Work Management</h3>

        <ul class="dashboard-links">

            <li>
                <a href="/manager/team">
                    My Team
                </a>
            </li>

            <li>
                <a href="/manager/leaves">
                    Leave Requests
                </a>
            </li>

            <li>
                <a href="/manager/attendance">
                    Team Attendance
                </a>
            </li>

            <li>
                <a href="/manager/payroll">
                    Team Payroll
                </a>
            </li>

            <li>
                <a href="/manager/projects">
                    Team Projects
                </a>
            </li>

            <li>
                <a href="/manager/tasks">
                    Team Tasks
                </a>
            </li>

        </ul>

    </div>


    <!-- =====================================================
         LOGOUT
         ===================================================== -->

    <form action="/logout" method="post">

        <button type="submit">
            Logout
        </button>

    </form>

</div>

</body>

</html>
