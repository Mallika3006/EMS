<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Department | Employee Management System</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        .department-page { max-width: 980px; margin: 0 auto; }
        .department-heading { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:22px; }
        .department-heading p { margin-top:6px; }
        .department-actions { display:flex; flex-wrap:wrap; gap:10px; }
        .department-actions button, .department-actions a { cursor:pointer; }
        .department-card { padding:24px; border-radius:14px; }
        .department-identity { display:flex; align-items:center; gap:16px; padding-bottom:22px; border-bottom:1px solid var(--border-color,#e2e8f0); }
        .department-icon { display:flex; align-items:center; justify-content:center; flex-shrink:0; width:54px; height:54px; border-radius:14px; background:var(--surface-secondary,#eef2ff); font-size:25px; }
        .department-identity h2 { margin:0 0 5px; overflow-wrap:anywhere; }
        .department-identity p { margin:0; color:var(--muted-text,#64748b); }
        .department-details { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; padding-top:22px; }
        .department-detail { padding:16px; border:1px solid var(--border-color,#e2e8f0); border-radius:10px; min-width:0; }
        .department-detail dt { color:var(--muted-text,#64748b); font-size:.88rem; margin-bottom:8px; }
        .department-detail dd { margin:0; font-weight:600; overflow-wrap:anywhere; white-space:pre-wrap; }
        .department-description { grid-column:1 / -1; }
        .department-state { padding:22px; border-radius:12px; }
        .department-state p { margin-bottom:0; }
        .department-error { color:#b42318; }
        .department-muted { color:var(--muted-text,#64748b); }
        @media (max-width:600px) { .department-card { padding:16px; } .department-identity { align-items:flex-start; } }
    </style>
</head>
<body>
<div class="container department-page">
    <header class="department-heading">
        <div>
            <h1>My Department</h1>
            <p class="department-muted">View the department associated with your employee profile.</p>
        </div>
        <div class="department-actions">
            <button type="button" id="refreshDepartment">Refresh details</button>
            <a class="back-link" th:href="@{/employee-dashboard}">← Back to Dashboard</a>
        </div>
    </header>

    <section id="department" class="card department-card" aria-live="polite" aria-busy="true">
        <div class="department-state">
            <p>Loading your department details…</p>
        </div>
    </section>
</div>

<script>
(() => {
    const departmentContainer = document.getElementById("department");
    const refreshButton = document.getElementById("refreshDepartment");

    function addDetail(parent, label, value, extraClass) {
        const wrapper = document.createElement("div");
        wrapper.className = "department-detail" + (extraClass ? " " + extraClass : "");
        const term = document.createElement("dt");
        term.textContent = label;
        const description = document.createElement("dd");
        description.textContent = value == null || String(value).trim() === ""
            ? "Not available"
            : String(value);
        wrapper.append(term, description);
        parent.appendChild(wrapper);
    }

    function showState(message, isError) {
        departmentContainer.replaceChildren();
        const state = document.createElement("div");
        state.className = "department-state";
        const paragraph = document.createElement("p");
        paragraph.textContent = message;
        if (isError) paragraph.className = "department-error";
        state.appendChild(paragraph);
        if (isError) {
            const retry = document.createElement("button");
            retry.type = "button";
            retry.textContent = "Try again";
            retry.addEventListener("click", loadDepartment);
            state.appendChild(retry);
        }
        departmentContainer.appendChild(state);
        departmentContainer.setAttribute("aria-busy", "false");
    }

    async function loadDepartment() {
        departmentContainer.setAttribute("aria-busy", "true");
        refreshButton.disabled = true;
        refreshButton.textContent = "Loading…";
        showState("Loading your department details…", false);

        try {
            const response = await fetch("/departments/me", {
                method: "GET",
                credentials: "same-origin",
                headers: { "Accept": "application/json" }
            });

            if (response.status === 401 || response.status === 403) {
                throw new Error("Your session may have expired or you do not have permission to view this department. Please sign in again if needed.");
            }
            if (response.status === 404) {
                showState("No department is currently assigned to your employee profile. Please contact HR to have your department assigned.", false);
                return;
            }
            if (!response.ok) {
                throw new Error("The server could not load your department (HTTP " + response.status + ").");
            }

            const department = await response.json();
            if (!department || department.departmentId == null) {
                showState("No department is currently assigned to your employee profile. Please contact HR to have your department assigned.", false);
                return;
            }

            departmentContainer.replaceChildren();
            const identity = document.createElement("div");
            identity.className = "department-identity";
            const icon = document.createElement("div");
            icon.className = "department-icon";
            icon.setAttribute("aria-hidden", "true");
            icon.textContent = "▦";

            const titleBlock = document.createElement("div");
            const title = document.createElement("h2");
            title.textContent = department.departmentName || "Department";
            const subtitle = document.createElement("p");
            subtitle.textContent = department.location
                ? "Located in " + department.location
                : "Your assigned department";
            titleBlock.append(title, subtitle);
            identity.append(icon, titleBlock);
            departmentContainer.appendChild(identity);

            const details = document.createElement("dl");
            details.className = "department-details";
            addDetail(details, "Department ID", department.departmentId);
            addDetail(details, "Department name", department.departmentName);
            addDetail(details, "Location", department.location);
            addDetail(details, "Description", department.description, "department-description");
            departmentContainer.appendChild(details);
            departmentContainer.setAttribute("aria-busy", "false");
        } catch (error) {
            console.error("Unable to load employee department:", error);
            showState(error.message || "Unable to load your department. Please try again.", true);
        } finally {
            refreshButton.disabled = false;
            refreshButton.textContent = "Refresh details";
        }
    }

    refreshButton.addEventListener("click", loadDepartment);
    loadDepartment();
})();
</script>
</body>
</html>
