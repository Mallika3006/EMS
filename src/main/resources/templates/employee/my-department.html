<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>My Department - StaffSync</title>

    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>My Department</h1>

    <div class="card" id="department">

        <p class="loading">
            Loading department...
        </p>

    </div>

    <a class="back-link" href="/employee-dashboard">
        ← Back to Dashboard
    </a>

</div>


<script>

    fetch('/departments/me')
        .then(response => {

            if (!response.ok) {
                throw new Error("Failed to load department");
            }

            return response.json();

        })

        .then(department => {

            const departmentDiv =
                document.getElementById("department");

            departmentDiv.innerHTML = `

                <div class="profile-row">
                    <span class="profile-label">
                        Department ID
                    </span>
                    <span>
                        ${department.departmentId ?? "Not available"}
                    </span>
                </div>

                <div class="profile-row">
                    <span class="profile-label">
                        Name
                    </span>
                    <span>
                        ${department.departmentName ?? "Not available"}
                    </span>
                </div>

                <div class="profile-row">
                    <span class="profile-label">
                        Location
                    </span>
                    <span>
                        ${department.location ?? "Not available"}
                    </span>
                </div>

                <div class="profile-row">
                    <span class="profile-label">
                        Description
                    </span>
                    <span>
                        ${department.description ?? "Not available"}
                    </span>
                </div>

            `;

        })

        .catch(error => {

            document.getElementById("department").innerHTML =
                "<p class='error-message'>Unable to load department.</p>";

            console.error(error);

        });

</script>

</body>
</html>
