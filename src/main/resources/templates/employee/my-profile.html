<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>My Profile - StaffSync</title>

    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
</head>

<body>

<div class="container">

    <h1>My Profile</h1>

    <div class="card" id="profile">

        <p class="loading">Loading profile...</p>

    </div>

    <br>

    <a class="btn" href="/employee-profile/edit">
        Edit Profile
    </a>

    <br><br>

    <a class="back-link" href="/employee-dashboard">
        ← Back to Dashboard
    </a>

</div>


<script>

    fetch('/employees/me/profile-details')
        .then(response => {

            if (!response.ok) {
                throw new Error("Failed to load profile");
            }

            return response.json();
        })

        .then(employee => {

            const photoHtml = employee.profilePhoto
                ? `<img src="${employee.profilePhoto}"
                         alt="Profile Photo"
                         class="profile-photo">`
                : `<p>No profile photo uploaded.</p>`;


            document.getElementById("profile").innerHTML = `

                <div class="profile-photo-container">
                    ${photoHtml}
                </div>


                <h3>Personal Information</h3>

                <div class="profile-row">
                    <span class="profile-label">Employee ID</span>
                    <span>${employee.employeeId}</span>
                </div>

                <div class="profile-row">
                    <span class="profile-label">First Name</span>
                    <span>${employee.firstName ?? "Not available"}</span>
                </div>

                <div class="profile-row">
                    <span class="profile-label">Last Name</span>
                    <span>${employee.lastName ?? "Not available"}</span>
                </div>

                <div class="profile-row">
                    <span class="profile-label">Email</span>
                    <span>${employee.email ?? "Not available"}</span>
                </div>

                <div class="profile-row">
                    <span class="profile-label">Phone</span>
                    <span>${employee.phone ?? "Not available"}</span>
                </div>

                <div class="profile-row">
                    <span class="profile-label">Date of Birth</span>
                    <span>${employee.dateOfBirth ?? "Not available"}</span>
                </div>

                <div class="profile-row">
                    <span class="profile-label">Hire Date</span>
                    <span>${employee.hireDate ?? "Not available"}</span>
                </div>

                <div class="profile-row">
                    <span class="profile-label">Address</span>
                    <span>${employee.address ?? "Not available"}</span>
                </div>


                <h3>Work Information</h3>

                <div class="profile-row">
                    <span class="profile-label">
                        Department
                    </span>
                    <span>
                        ${employee.departmentName ?? "Not assigned"}
                    </span>
                </div>

                <div class="profile-row">
                    <span class="profile-label">
                        Designation
                    </span>
                    <span>
                        ${employee.designationTitle ?? "Not assigned"}
                    </span>
                </div>


                <h3>Manager</h3>

                <div class="profile-row">
                    <span class="profile-label">
                        Name
                    </span>
                    <span>
                        ${employee.managerName ?? "Not assigned"}
                    </span>
                </div>

                <div class="profile-row">
                    <span class="profile-label">
                        Email
                    </span>
                    <span>
                        ${employee.managerEmail ?? "Not available"}
                    </span>
                </div>

                <div class="profile-row">
                    <span class="profile-label">
                        Phone
                    </span>
                    <span>
                        ${employee.managerPhone ?? "Not available"}
                    </span>
                </div>


                <h3>HR</h3>

                <div class="profile-row">
                    <span class="profile-label">
                        Name
                    </span>
                    <span>
                        ${employee.hrName ?? "Not assigned"}
                    </span>
                </div>

                <div class="profile-row">
                    <span class="profile-label">
                        Email
                    </span>
                    <span>
                        ${employee.hrEmail ?? "Not available"}
                    </span>
                </div>

                <div class="profile-row">
                    <span class="profile-label">
                        Phone
                    </span>
                    <span>
                        ${employee.hrPhone ?? "Not available"}
                    </span>
                </div>

            `;

        })

        .catch(error => {

            document.getElementById("profile").innerHTML =
                "<p class='error-message'>Unable to load profile.</p>";

            console.error(error);

        });

</script>

</body>
</html>
