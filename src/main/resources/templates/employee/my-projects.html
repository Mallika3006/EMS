<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>My Projects - StaffSync</title>

    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>My Projects</h1>

    <div class="card" id="projects">

        <p class="loading">
            Loading projects...
        </p>

    </div>

    <br>

    <a class="back-link" href="/employee-dashboard">
        ← Back to Dashboard
    </a>

</div>


<script>

    // =========================================================
    // LOAD MY PROJECTS
    // =========================================================

    fetch('/projects/me')

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load projects"
                );

            }

            return response.json();

        })


        .then(projectList => {

            const projectsDiv =
                document.getElementById("projects");


            // =====================================================
            // NO PROJECTS
            // =====================================================

            if (
                !projectList ||
                projectList.length === 0
            ) {

                projectsDiv.innerHTML = `

                    <h3>My Project Records</h3>

                    <p class="empty-message">
                        No projects found.
                    </p>

                `;

                return;
            }


            // =====================================================
            // GET TODAY'S DATE
            // =====================================================

            const today =
                new Date()
                    .toISOString()
                    .split("T")[0];


            // =====================================================
            // SEPARATE COMPLETED AND CURRENT/UPCOMING
            // =====================================================

            const completedProjects =
                projectList.filter(project =>

                    project.endDate &&
                    project.endDate < today

                );


            const activeProjects =
                projectList.filter(project =>

                    !project.endDate ||
                    project.endDate >= today

                );


            // =====================================================
            // CREATE PROJECT TABLE
            // =====================================================

            function createProjectTable(projects) {

                if (
                    !projects ||
                    projects.length === 0
                ) {

                    return `

                        <p class="empty-message">
                            No projects in this section.
                        </p>

                    `;

                }


                let html = `

                    <table>

                        <thead>

                            <tr>

                                <th>Project ID</th>
                                <th>Project Name</th>
                                <th>Start Date</th>
                                <th>End Date</th>

                            </tr>

                        </thead>

                        <tbody>

                `;


                projects.forEach(project => {

                    html += `

                        <tr>

                            <td>
                                ${project.projectId ?? "-"}
                            </td>

                            <td>
                                ${project.projectName ?? "-"}
                            </td>

                            <td>
                                ${project.startDate ?? "-"}
                            </td>

                            <td>
                                ${project.endDate ?? "-"}
                            </td>

                        </tr>

                    `;

                });


                html += `

                        </tbody>

                    </table>

                `;

                return html;

            }


            // =====================================================
            // DISPLAY PROJECT SECTIONS
            // =====================================================

            projectsDiv.innerHTML = `

                <h3>My Project Records</h3>


                <details>

                    <summary>
                        Active / Upcoming (${activeProjects.length})
                    </summary>

                    ${createProjectTable(activeProjects)}

                </details>


                <br>


                <details>

                    <summary>
                        Completed (${completedProjects.length})
                    </summary>

                    ${createProjectTable(completedProjects)}

                </details>

            `;

        })


        // =========================================================
        // ERROR HANDLING
        // =========================================================

        .catch(error => {

            document.getElementById("projects").innerHTML = `

                <p class="error-message">
                    Unable to load projects.
                </p>

            `;

            console.error(error);

        });

</script>

</body>

</html>
