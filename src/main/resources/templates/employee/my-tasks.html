<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>My Tasks - StaffSync</title>

    <link rel="stylesheet" th:href="@{/style.css}">

    <link rel="icon"
          type="image/x-icon"
          th:href="@{/favicon.ico}">

</head>

<body>

<div class="container">

    <h1>My Tasks</h1>

    <div class="card" id="tasks">

        <p class="loading">
            Loading tasks...
        </p>

    </div>

    <br>

    <a class="back-link"
       href="/employee-dashboard">

        ← Back to Dashboard

    </a>

</div>


<script>

    // =========================================================
    // LOAD MY TASKS
    // =========================================================

    fetch('/tasks/me')

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load tasks"
                );

            }

            return response.json();

        })


        .then(taskList => {

            const tasksDiv =
                document.getElementById("tasks");


            // =====================================================
            // NO TASKS
            // =====================================================

            if (
                !taskList ||
                taskList.length === 0
            ) {

                tasksDiv.innerHTML = `

                    <h3>My Task Records</h3>

                    <p class="empty-message">
                        No tasks found.
                    </p>

                `;

                return;
            }


            // =====================================================
            // SEPARATE COMPLETED AND PENDING
            // =====================================================

            const completedTasks =
                taskList.filter(task =>

                    task.status &&

                    task.status.toLowerCase() ===
                    "completed"

                );


            const pendingTasks =
                taskList.filter(task =>

                    !task.status ||

                    task.status.toLowerCase() !==
                    "completed"

                );


            // =====================================================
            // CREATE TASK TABLE
            // =====================================================

            function createTaskTable(tasks) {

                if (
                    !tasks ||
                    tasks.length === 0
                ) {

                    return `

                        <p class="empty-message">
                            No tasks in this section.
                        </p>

                    `;

                }


                let html = `

                    <table>

                        <thead>

                            <tr>

                                <th>Task ID</th>

                                <th>Task Name</th>

                                <th>Description</th>

                                <th>Project</th>

                                <th>Priority</th>

                                <th>Status</th>

                                <th>Start Date</th>

                                <th>Due Date</th>

                            </tr>

                        </thead>

                        <tbody>

                `;


                tasks.forEach(task => {

                    html += `

                        <tr>

                            <td>
                                ${task.taskId ?? "-"}
                            </td>

                            <td>
                                ${task.taskName ?? "-"}
                            </td>

                            <td>
                                ${task.description ?? "-"}
                            </td>

                            <td>
                                ${
                        task.project?.projectName
                        ?? "-"
                    }
                            </td>

                            <td>
                                ${task.priority ?? "-"}
                            </td>

                            <td>
                                ${task.status ?? "-"}
                            </td>

                            <td>
                                ${task.startDate ?? "-"}
                            </td>

                            <td>
                                ${task.dueDate ?? "-"}
                            </td>

                        </tr>

                    `;

                });


                html += `

                        </tbody>

                    </table>

                `;

                return html;

            }


            // =====================================================
            // DISPLAY SECTIONS
            // =====================================================

            tasksDiv.innerHTML = `

                <h3>My Task Records</h3>


                <details>

                    <summary>
                        Pending (${pendingTasks.length})
                    </summary>

                    ${createTaskTable(
                pendingTasks
            )}

                </details>


                <br>


                <details>

                    <summary>
                        Completed (${completedTasks.length})
                    </summary>

                    ${createTaskTable(
                completedTasks
            )}

                </details>

            `;

        })


        // =========================================================
        // ERROR HANDLING
        // =========================================================

        .catch(error => {

            document.getElementById(
                "tasks"
            ).innerHTML = `

                <p class="error-message">
                    Unable to load tasks.
                </p>

            `;

            console.error(error);

        });

</script>

</body>

</html>
