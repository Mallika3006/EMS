<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Departments - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Department Management</h1>

    <!-- DEPARTMENT LIST -->
    <div class="card">

        <h2>Departments</h2>

        <table>

            <thead>
            <tr>
                <th>Department ID</th>
                <th>Department Name</th>
                <th>Location</th>
                <th>Description</th>
            </tr>
            </thead>

            <tbody id="departmentTable">

            <tr>
                <td colspan="4">
                    Loading departments...
                </td>
            </tr>

            </tbody>

        </table>

    </div>

    <br>

    <a class="back-link" href="/hr-dashboard">
        ← Back to HR Dashboard
    </a>

</div>

<script>

    // ==========================================
    // LOAD ALL DEPARTMENTS
    // ==========================================

    function loadDepartments() {

        fetch("/departments")

            .then(response => {

                if (!response.ok) {
                    throw new Error("Failed to load departments");
                }

                return response.json();
            })

            .then(departments => {
                displayDepartments(departments);
            })

            .catch(error => {

                document.getElementById("departmentTable").innerHTML = `
                <tr>
                    <td colspan="4">
                        Unable to load departments.
                    </td>
                </tr>
            `;

                console.error(error);
            });
    }


    // ==========================================
    // DISPLAY DEPARTMENTS
    // ==========================================

    function displayDepartments(departments) {

        const table = document.getElementById("departmentTable");

        table.innerHTML = "";

        if (!departments || departments.length === 0) {

            table.innerHTML = `
            <tr>
                <td colspan="4">
                    No departments found.
                </td>
            </tr>
        `;

            return;
        }

        departments.forEach(department => {

            const row = document.createElement("tr");

            row.innerHTML = `
            <td>${department.departmentId ?? "N/A"}</td>
            <td>${department.departmentName ?? "N/A"}</td>
            <td>${department.location ?? "N/A"}</td>
            <td>${department.description ?? "N/A"}</td>
        `;

            table.appendChild(row);

        });
    }


    // ==========================================
    // INITIAL LOAD
    // ==========================================

    loadDepartments();

</script>

</body>
</html>
