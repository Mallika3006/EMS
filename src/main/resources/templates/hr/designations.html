<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Designations - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Designation Management</h1>

    <!-- DESIGNATION LIST -->
    <div class="card">

        <h2>Designations</h2>

        <table>

            <thead>
            <tr>
                <th>Designation ID</th>
                <th>Title</th>
                <th>Minimum Salary</th>
                <th>Maximum Salary</th>
            </tr>
            </thead>

            <tbody id="designationTable">

            <tr>
                <td colspan="4">
                    Loading designations...
                </td>
            </tr>

            </tbody>

        </table>

    </div>

    <br>

    <a class="back-link" href="/hr-dashboard">
        ← Back to HR Dashboard
    </a>

</div>

<script>

    // ==========================================
    // LOAD ALL DESIGNATIONS
    // ==========================================

    function loadDesignations() {

        fetch("/designations")

            .then(response => {

                if (!response.ok) {
                    throw new Error("Failed to load designations");
                }

                return response.json();
            })

            .then(designations => {
                displayDesignations(designations);
            })

            .catch(error => {

                document.getElementById("designationTable").innerHTML = `
                <tr>
                    <td colspan="4">
                        Unable to load designations.
                    </td>
                </tr>
            `;

                console.error(error);
            });
    }


    // ==========================================
    // DISPLAY DESIGNATIONS
    // ==========================================

    function displayDesignations(designations) {

        const table = document.getElementById("designationTable");

        table.innerHTML = "";

        if (!designations || designations.length === 0) {

            table.innerHTML = `
            <tr>
                <td colspan="4">
                    No designations found.
                </td>
            </tr>
        `;

            return;
        }

        designations.forEach(designation => {

            const row = document.createElement("tr");

            row.innerHTML = `
            <td>${designation.designationId ?? "N/A"}</td>
            <td>${designation.designationTitle ?? "N/A"}</td>
            <td>${designation.minSalary ?? "N/A"}</td>
            <td>${designation.maxSalary ?? "N/A"}</td>
        `;

            table.appendChild(row);

        });
    }


    // ==========================================
    // INITIAL LOAD
    // ==========================================

    loadDesignations();

</script>

</body>
</html>
