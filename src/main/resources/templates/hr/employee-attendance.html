<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Employee Attendance</h1>

    <!-- ATTENDANCE FILTERS -->
    <div class="card">

        <h2>Attendance Records</h2>

        <button type="button" onclick="loadAttendance()">
            Show All
        </button>

        <br><br>

        <label for="dateFilter">Search by Date:</label>
        <input type="date" id="dateFilter">

        <button type="button" onclick="searchByDate()">
            Search
        </button>

        <button type="button" onclick="resetFilters()">
            Reset
        </button>

        <br><br>

        <label for="statusFilter">Filter by Status:</label>

        <select id="statusFilter">
            <option value="">Select Status</option>
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
            <option value="Late">Late</option>
            <option value="Leave">Leave</option>
        </select>

        <button type="button" onclick="searchByStatus()">
            Search
        </button>

    </div>

    <br>

    <!-- ADD ATTENDANCE -->
    <div class="card">

        <h2>Add Attendance</h2>

        <form id="addAttendanceForm">

            <label for="employeeId">Select Employee:</label>

            <select id="employeeId" required>
                <option value="">Select Employee</option>
            </select>

            <br><br>

            <label for="attDate">Date:</label>
            <input type="date" id="attDate" required>

            <br><br>

            <label for="attStatus">Status:</label>

            <select id="attStatus" required>
                <option value="">Select Status</option>
                <option value="Present">Present</option>
                <option value="Absent">Absent</option>
                <option value="Late">Late</option>
                <option value="Leave">Leave</option>
            </select>

            <br><br>

            <label for="checkInTime">Check-In Time:</label>
            <input type="time" id="checkInTime">

            <br><br>

            <label for="checkOutTime">Check-Out Time:</label>
            <input type="time" id="checkOutTime">

            <br><br>

            <button type="submit" id="addAttendanceButton">
                Add Attendance
            </button>

        </form>

    </div>

    <br>

    <!-- ATTENDANCE TABLE -->
    <div class="card">

        <h2>Attendance Details</h2>

        <table border="1" width="100%" cellpadding="10">

            <thead>
            <tr>
                <th>Attendance ID</th>
                <th>Employee ID</th>
                <th>Date</th>
                <th>Status</th>
                <th>Check In</th>
                <th>Check Out</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody id="attendanceTable">
            </tbody>

        </table>

    </div>

    <br>

    <div class="dashboard-links">
        <a href="/hr-dashboard">Back to HR Dashboard</a>
    </div>

</div>

<script>

    // Store attendance records belonging to the logged-in HR's employees.
    let hrAttendance = [];

    // =========================
    // LOAD HR ATTENDANCE
    // =========================
    async function loadAttendance() {

        try {

            const response = await fetch("/attendance/hr");

            if (!response.ok) {
                throw new Error(await response.text());
            }

            hrAttendance = await response.json();

            displayAttendance(hrAttendance);

        } catch (error) {

            console.error("Error loading attendance:", error);
            alert("Error loading HR attendance.");

        }
    }

    // =========================
    // DISPLAY ATTENDANCE
    // =========================
    function displayAttendance(attendance) {

        const table = document.getElementById("attendanceTable");

        table.innerHTML = "";

        if (!attendance || attendance.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="7">
                        No attendance records found.
                    </td>
                </tr>
            `;

            return;
        }

        attendance.forEach(record => {

            const row = document.createElement("tr");

            const employeeId = record.employee
                ? record.employee.employeeId
                : "";

            row.innerHTML = `
                <td>${record.attendanceId ?? ""}</td>
                <td>${employeeId}</td>
                <td>${record.attDate ?? ""}</td>
                <td>${record.status ?? ""}</td>
                <td>${record.checkInTime ?? ""}</td>
                <td>${record.checkOutTime ?? ""}</td>
                <td>
                    <button
                        type="button"
                        onclick="deleteAttendance(${record.attendanceId})">
                        Delete
                    </button>
                </td>
            `;

            table.appendChild(row);

        });
    }

    // =========================
    // SEARCH BY DATE
    // =========================
    function searchByDate() {

        const date = document.getElementById("dateFilter").value;

        if (!date) {
            alert("Please select a date.");
            return;
        }

        const filteredAttendance = hrAttendance.filter(record =>
            String(record.attDate ?? "").substring(0, 10) === date
        );

        displayAttendance(filteredAttendance);
    }

    // =========================
    // SEARCH BY STATUS
    // =========================
    function searchByStatus() {

        const status = document.getElementById("statusFilter").value;

        if (!status) {
            alert("Please select a status.");
            return;
        }

        const filteredAttendance = hrAttendance.filter(record =>
            record.status &&
            record.status.toLowerCase() === status.toLowerCase()
        );

        displayAttendance(filteredAttendance);
    }

    // =========================
    // RESET FILTERS
    // =========================
    function resetFilters() {

        document.getElementById("dateFilter").value = "";
        document.getElementById("statusFilter").value = "";

        loadAttendance();
    }

    // =========================
    // ADD ATTENDANCE
    // =========================
    document.getElementById("addAttendanceForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const employeeId = Number(
                document.getElementById("employeeId").value
            );

            const attDate = document.getElementById("attDate").value;
            const status = document.getElementById("attStatus").value;
            const checkInTime = document.getElementById("checkInTime").value;
            const checkOutTime = document.getElementById("checkOutTime").value;

            if (!employeeId || !attDate || !status) {
                alert("Please fill in all required fields.");
                return;
            }

            const attendanceData = {
                employee: {
                    employeeId: employeeId
                },
                attDate: attDate,
                status: status,
                checkInTime: checkInTime || null,
                checkOutTime: checkOutTime || null
            };

            const button = document.getElementById("addAttendanceButton");

            try {

                button.disabled = true;

                const response = await fetch("/attendance", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(attendanceData)
                });

                if (!response.ok) {
                    throw new Error(await response.text());
                }

                alert("Attendance added successfully!");

                document.getElementById("addAttendanceForm").reset();

                await loadAttendance();

            } catch (error) {

                console.error("Error adding attendance:", error);

                alert(
                    "Could not add attendance. " +
                    "Please check the backend response and employee assignment."
                );

            } finally {

                button.disabled = false;

            }
        });

    // =========================
    // DELETE ATTENDANCE
    // =========================
    async function deleteAttendance(id) {

        const confirmed = confirm(
            "Are you sure you want to delete this attendance record?"
        );

        if (!confirmed) {
            return;
        }

        try {

            const response = await fetch(`/attendance/${id}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                throw new Error(await response.text());
            }

            alert("Attendance deleted successfully!");

            await loadAttendance();

        } catch (error) {

            console.error("Error deleting attendance:", error);
            alert("Error deleting attendance.");

        }
    }

    // =========================
    // LOAD EMPLOYEES ASSIGNED TO LOGGED-IN HR
    // =========================
    async function loadHrEmployees() {

        const employeeSelect = document.getElementById("employeeId");

        try {

            const response = await fetch("/employees/hr/my-employees");

            if (!response.ok) {
                throw new Error(await response.text());
            }

            const employees = await response.json();

            employeeSelect.innerHTML =
                '<option value="">Select Employee</option>';

            if (!employees || employees.length === 0) {

                employeeSelect.innerHTML =
                    '<option value="">No employees assigned</option>';

                return;
            }

            employees.forEach(employee => {

                const option = document.createElement("option");

                option.value = employee.employeeId;

                option.textContent =
                    employee.employeeId + " - " +
                    employee.firstName + " " +
                    employee.lastName;

                employeeSelect.appendChild(option);

            });

        } catch (error) {

            console.error("Error loading HR employees:", error);

            employeeSelect.innerHTML =
                '<option value="">Could not load employees</option>';

            alert("Error loading employees assigned to HR.");

        }
    }

    // =========================
    // INITIAL LOAD
    // =========================
    document.addEventListener("DOMContentLoaded", function() {

        loadHrEmployees();
        loadAttendance();

    });

</script>

</body>
</html>
