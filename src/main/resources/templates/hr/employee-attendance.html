<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Employee Attendance - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    ```
    <h1>Employee Attendance</h1>

    <div class="card">

        <h2>Attendance Records</h2>

        <button onclick="loadAttendance()">
            Show All
        </button>

        <br><br>

        <label>Search by Date:</label>

        <input
                type="date"
                id="dateFilter">

        <button onclick="searchByDate()">
            Search
        </button>

        <button onclick="loadAttendance()">
            Reset
        </button>

        <br><br>

        <label>Filter by Status:</label>

        <select id="statusFilter">

            <option value="">
                Select Status
            </option>

            <option value="Present">
                Present
            </option>

            <option value="Absent">
                Absent
            </option>

            <option value="Late">
                Late
            </option>

            <option value="Leave">
                Leave
            </option>

        </select>

        <button onclick="searchByStatus()">
            Search
        </button>

    </div>


    <br>


    <div class="card">

        <table border="1" width="100%" cellpadding="10">

            <thead>

            <tr>

                <th>Attendance ID</th>
                <th>Employee ID</th>
                <th>Date</th>
                <th>Status</th>
                <th>Check In</th>
                <th>Check Out</th>
                <th>Action</th>

            </tr>

            </thead>


            <tbody id="attendanceTable">

            </tbody>

        </table>

    </div>


    <br>


    <div class="dashboard-links">

        <a href="/hr-dashboard">
            Back to HR Dashboard
        </a>

    </div>
    ```

</div>

<script>

    // =========================
    // LOAD ALL ATTENDANCE
    // =========================

    async function loadAttendance() {

        try {

            const response =
                await fetch("/attendance");


            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(errorText);

                throw new Error(
                    "Failed to fetch attendance"
                );
            }


            const attendance =
                await response.json();


            displayAttendance(attendance);

        } catch (error) {

            console.error(error);

            alert(
                "Error loading attendance."
            );
        }
    }


    // =========================
    // DISPLAY ATTENDANCE
    // =========================

    function displayAttendance(attendance) {

        const table =
            document.getElementById(
                "attendanceTable"
            );


        table.innerHTML = "";


        if (
            !attendance ||
            attendance.length === 0
        ) {

            table.innerHTML = `
                <tr>
                    <td colspan="7">
                        No attendance records found.
                    </td>
                </tr>
            `;

            return;
        }


        attendance.forEach(record => {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${record.attendanceId ?? ""}
                </td>

                <td>
                    ${
                record.employee
                    ? record.employee.employeeId
                    : ""
            }
                </td>

                <td>
                    ${record.attDate ?? ""}
                </td>

                <td>
                    ${record.status ?? ""}
                </td>

                <td>
                    ${record.checkInTime ?? ""}
                </td>

                <td>
                    ${record.checkOutTime ?? ""}
                </td>

                <td>

                    <button
                        onclick="deleteAttendance(
                            ${record.attendanceId}
                        )">

                        Delete

                    </button>

                </td>

            `;


            table.appendChild(row);

        });
    }


    // =========================
    // SEARCH BY DATE
    // =========================

    async function searchByDate() {

        const date =
            document.getElementById(
                "dateFilter"
            ).value;


        if (!date) {

            alert(
                "Please select a date."
            );

            return;
        }


        try {

            const response =
                await fetch(
                    `/attendance/date?date=${date}`
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(errorText);

                throw new Error(
                    "Failed to fetch attendance"
                );
            }


            const attendance =
                await response.json();


            displayAttendance(attendance);

        } catch (error) {

            console.error(error);

            alert(
                "Error searching attendance."
            );
        }
    }


    // =========================
    // SEARCH BY STATUS
    // =========================

    async function searchByStatus() {

        const status =
            document.getElementById(
                "statusFilter"
            ).value;


        if (!status) {

            alert(
                "Please select a status."
            );

            return;
        }


        try {

            const response =
                await fetch(
                    `/attendance/status?status=${encodeURIComponent(status)}`
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(errorText);

                throw new Error(
                    "Failed to fetch attendance"
                );
            }


            const attendance =
                await response.json();


            displayAttendance(attendance);

        } catch (error) {

            console.error(error);

            alert(
                "Error searching attendance."
            );
        }
    }


    // =========================
    // DELETE ATTENDANCE
    // =========================

    async function deleteAttendance(id) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this attendance record?"
            );


        if (!confirmed) {

            return;
        }


        try {

            const response =
                await fetch(
                    `/attendance/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(errorText);

                throw new Error(
                    "Failed to delete attendance"
                );
            }


            alert(
                "Attendance deleted successfully!"
            );


            loadAttendance();

        } catch (error) {

            console.error(error);

            alert(
                "Error deleting attendance."
            );
        }
    }


    // =========================
    // INITIAL LOAD
    // =========================

    loadAttendance();

</script>

</body>

</html>
