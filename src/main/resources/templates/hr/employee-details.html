<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Employee Details - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Employee Details</h1>

    <div class="card" id="employee">

        <p class="loading">
            Loading employee details...
        </p>

    </div>

    <br>

    <button class="btn" onclick="editEmployee()">
        Edit Employee
    </button>

    <br><br>

    <a class="back-link" href="/hr/employees">
        ← Back to Employees
    </a>

    <br><br>

    <a class="back-link" href="/hr-dashboard">
        ← Back to HR Dashboard
    </a>

</div>


<script>

    // ==========================================
    // GET EMPLOYEE ID FROM URL
    // ==========================================

    const pathParts =
        window.location.pathname.split("/");

    const employeeId =
        pathParts[pathParts.length - 1];


    // ==========================================
    // EDIT EMPLOYEE
    // ==========================================

    function editEmployee() {

        window.location.href =
            `/hr/employees/${employeeId}/edit`;
    }


    // ==========================================
    // LOAD EMPLOYEE
    // ==========================================

    fetch(`/employees/${employeeId}`)
        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load employee"
                );
            }

            return response.json();
        })

        .then(employee => {

            const container =
                document.getElementById("employee");


            // ==========================================
            // PROFILE PHOTO
            // ==========================================

            const photoHtml =
                employee.profilePhoto

                    ? `
                        <div class="profile-photo-container">

                            <img
                                src="${employee.profilePhoto}"
                                alt="Profile Photo"
                                class="profile-photo">

                        </div>
                      `

                    : `
                        <p>
                            No profile photo uploaded.
                        </p>
                      `;


            // ==========================================
            // EMPLOYEE DETAILS
            // ==========================================

            container.innerHTML = `

                ${photoHtml}


                <div class="profile-row">
                    <span class="profile-label">
                        Employee ID
                    </span>

                    <span>
                        ${employee.employeeId ?? "N/A"}
                    </span>
                </div>


                <div class="profile-row">
                    <span class="profile-label">
                        First Name
                    </span>

                    <span>
                        ${employee.firstName || "N/A"}
                    </span>
                </div>


                <div class="profile-row">
                    <span class="profile-label">
                        Last Name
                    </span>

                    <span>
                        ${employee.lastName || "N/A"}
                    </span>
                </div>


                <div class="profile-row">
                    <span class="profile-label">
                        Email
                    </span>

                    <span>
                        ${employee.email || "N/A"}
                    </span>
                </div>


                <div class="profile-row">
                    <span class="profile-label">
                        Phone
                    </span>

                    <span>
                        ${employee.phone || "N/A"}
                    </span>
                </div>


                <div class="profile-row">
                    <span class="profile-label">
                        Date of Birth
                    </span>

                    <span>
                        ${employee.dateOfBirth ?? "N/A"}
                    </span>
                </div>


                <div class="profile-row">
                    <span class="profile-label">
                        Hire Date
                    </span>

                    <span>
                        ${employee.hireDate ?? "N/A"}
                    </span>
                </div>


                <div class="profile-row">
                    <span class="profile-label">
                        Address
                    </span>

                    <span>
                        ${employee.address ?? "N/A"}
                    </span>
                </div>


                <div class="profile-row">
                    <span class="profile-label">
                        Designation ID
                    </span>

                    <span>
                        ${employee.designationId ?? "Not assigned"}
                    </span>
                </div>


                <div class="profile-row">
                    <span class="profile-label">
                        Team ID
                    </span>

                    <span>
                        ${employee.teamId ?? "Not assigned"}
                    </span>
                </div>


                <div class="profile-row">
                    <span class="profile-label">
                        Manager ID
                    </span>

                    <span>
                        ${employee.managerId ?? "Not assigned"}
                    </span>
                </div>


                <div class="profile-row">
                    <span class="profile-label">
                        HR ID
                    </span>

                    <span>
                        ${employee.hrId ?? "Not assigned"}
                    </span>
                </div>

            `;

        })


        // ==========================================
        // ERROR HANDLING
        // ==========================================

        .catch(error => {

            document.getElementById("employee").innerHTML =
                "<p class='error-message'>Unable to load employee details.</p>";

            console.error(error);

        });

</script>

</body>

</html>
