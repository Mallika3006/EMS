<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">

    <h1>Employee Details</h1>

    <div id="employeeDetails">
        Loading employee details...
    </div>

    <p> <a href="/hr/employees">← Back to Employees</a> </p>

    <p>
        <a href="/hr-dashboard">← Back to HR Dashboard</a>
    </p>

</div>

<script>
    const employeeId = window.location.pathname.split("/").pop();

    async function loadEmployeeDetails() {
        const details = document.getElementById("employeeDetails");

        try {
            const response = await fetch(`/employees/${employeeId}`);

            if (!response.ok) {
                throw new Error("Failed to load employee details");
            }

            const employee = await response.json();

            const departmentName =
                employee.department?.departmentName ?? "Not assigned";

            const designationName =
                employee.designation?.designationTitle ?? "Not assigned";

            async function getEmployeeName(id) {
                if (id == null) {
                    return "Not assigned";
                }

                try {
                    const response = await fetch(`/employees/${id}`);

                    if (!response.ok) {
                        return "Not available";
                    }

                    const person = await response.json();

                    return `${person.firstName ?? ""} ${person.lastName ?? ""}`.trim()
                        || "Not available";
                } catch {
                    return "Not available";
                }
            }

            const managerName = await getEmployeeName(employee.managerId);
            const hrName = await getEmployeeName(employee.hrId);

            details.innerHTML = `
    <div class="card">
        <h2>${employee.firstName ?? ""} ${employee.lastName ?? ""}</h2>

        <p><strong>Employee ID:</strong> ${employee.employeeId}</p>
        <p><strong>First Name:</strong> ${employee.firstName ?? "Not available"}</p>
        <p><strong>Last Name:</strong> ${employee.lastName ?? "Not available"}</p>
        <p><strong>Email:</strong> ${employee.email ?? "Not available"}</p>
        <p><strong>Phone:</strong> ${employee.phone ?? "Not available"}</p>
        <p><strong>Date of Birth:</strong> ${employee.dateOfBirth ?? "Not available"}</p>
        <p><strong>Hire Date:</strong> ${employee.hireDate ?? "Not available"}</p>
        <p><strong>Address:</strong> ${employee.address ?? "Not available"}</p>
        <p><strong>Department:</strong> ${departmentName}</p>
        <p><strong>Designation:</strong> ${designationName}</p>
        <p><strong>Manager:</strong> ${managerName}</p>
        <p><strong>HR:</strong> ${hrName}</p>
    </div>
`;

        } catch (error) {
            details.innerHTML = "<p>Unable to load employee details.</p>";
            console.error(error);
        }
    }

    loadEmployeeDetails();
</script>

</body>
</html>
