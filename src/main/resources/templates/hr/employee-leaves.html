<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Leaves - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Employee Leaves</h1>

    <!-- LEAVE FILTERS -->
    <div class="card">

        <h2>Leave Records</h2>

        <button type="button" onclick="loadLeaves()">Show All</button>

        <br><br>

        <label for="employeeId">Employee ID:</label>
        <input type="number" id="employeeId" placeholder="Enter Employee ID">

        <button type="button" onclick="searchByEmployee()">Search</button>

        <br><br>

        <label for="statusFilter">Status:</label>

        <select id="statusFilter">
            <option value="">Select Status</option>
            <option value="PENDING">Pending</option>
            <option value="APPROVED">Approved</option>
            <option value="REJECTED">Rejected</option>
            <option value="WITHDRAWN">Withdrawn</option>
        </select>

        <button type="button" onclick="searchByStatus()">Search</button>

        <br><br>

        <label for="startDate">From Date:</label>
        <input type="date" id="startDate">

        <label for="endDate">To Date:</label>
        <input type="date" id="endDate">

        <button type="button" onclick="searchBetweenDates()">Search</button>
        <button type="button" onclick="resetFilters()">Reset</button>

    </div>

    <br>

    <!-- LEAVE TABLE -->
    <div class="card">

        <h2>Employee Leave Details</h2>

        <table border="1" width="100%" cellpadding="10">

            <thead>
            <tr>
                <th>Leave ID</th>
                <th>Employee ID</th>
                <th>From Date</th>
                <th>To Date</th>
                <th>Reason</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody id="leaveTable">
            </tbody>

        </table>

    </div>

    <br>

    <div class="dashboard-links">
        <a href="/hr-dashboard">Back to HR Dashboard</a>
    </div>

</div>

<script>

    // Leave records belonging to employees assigned to the logged-in HR.
    let hrLeaves = [];

    // =========================
    // LOAD HR LEAVES
    // =========================
    async function loadLeaves() {

        try {

            const response = await fetch("/leaves/hr");

            if (!response.ok) {
                throw new Error(await response.text());
            }

            hrLeaves = await response.json();

            displayLeaves(hrLeaves);

        } catch (error) {

            console.error("Error loading HR leaves:", error);
            alert("Error loading employee leaves.");

        }
    }

    // =========================
    // DISPLAY LEAVES
    // =========================
    function displayLeaves(leaves) {

        const table = document.getElementById("leaveTable");

        table.innerHTML = "";

        if (!leaves || leaves.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="7">No leave records found.</td>
                </tr>
            `;

            return;
        }

        leaves.forEach(leave => {

            const row = document.createElement("tr");

            const employeeId = leave.employee
                ? leave.employee.employeeId
                : (leave.employeeId ?? "");

            const values = [
                leave.leaveId ?? "",
                employeeId,
                leave.fromDate ?? "",
                leave.toDate ?? "",
                leave.reason ?? "",
                leave.status ?? ""
            ];

            values.forEach(value => {

                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);

            });

            const actionCell = document.createElement("td");

            // Only pending requests can be approved or rejected.
            if (String(leave.status ?? "").toUpperCase() === "PENDING") {

                const approveButton = document.createElement("button");

                approveButton.type = "button";
                approveButton.textContent = "Approve";

                approveButton.addEventListener("click", function () {
                    updateLeaveStatus(leave.leaveId, "APPROVED");
                });

                const rejectButton = document.createElement("button");

                rejectButton.type = "button";
                rejectButton.textContent = "Reject";

                rejectButton.addEventListener("click", function () {
                    updateLeaveStatus(leave.leaveId, "REJECTED");
                });

                actionCell.appendChild(approveButton);
                actionCell.appendChild(rejectButton);
            }

            const deleteButton = document.createElement("button");

            deleteButton.type = "button";
            deleteButton.textContent = "Delete";

            deleteButton.addEventListener("click", function () {
                deleteLeave(leave.leaveId);
            });

            actionCell.appendChild(deleteButton);
            row.appendChild(actionCell);

            table.appendChild(row);

        });
    }

    // =========================
    // SEARCH BY EMPLOYEE ID
    // =========================
    function searchByEmployee() {

        const employeeId =
            document.getElementById("employeeId").value;

        if (!employeeId) {
            alert("Please enter Employee ID.");
            return;
        }

        const filteredLeaves = hrLeaves.filter(leave => {

            const id = leave.employee
                ? leave.employee.employeeId
                : leave.employeeId;

            return Number(id) === Number(employeeId);

        });

        displayLeaves(filteredLeaves);
    }

    // =========================
    // SEARCH BY STATUS
    // =========================
    function searchByStatus() {

        const status =
            document.getElementById("statusFilter").value;

        if (!status) {
            alert("Please select a status.");
            return;
        }

        const filteredLeaves = hrLeaves.filter(leave =>
            String(leave.status ?? "").toUpperCase() === status
        );

        displayLeaves(filteredLeaves);
    }

    // =========================
    // SEARCH BETWEEN DATES
    // =========================
    function searchBetweenDates() {

        const startDate =
            document.getElementById("startDate").value;

        const endDate =
            document.getElementById("endDate").value;

        if (!startDate || !endDate) {
            alert("Please select both dates.");
            return;
        }

        if (startDate > endDate) {
            alert("From Date cannot be after To Date.");
            return;
        }

        const filteredLeaves = hrLeaves.filter(leave => {

            const fromDate = String(leave.fromDate ?? "").substring(0, 10);
            const toDate = String(leave.toDate ?? "").substring(0, 10);

            // Include leave requests overlapping the selected range.
            return fromDate &&
                toDate &&
                fromDate <= endDate &&
                toDate >= startDate;

        });

        displayLeaves(filteredLeaves);
    }

    // =========================
    // APPROVE OR REJECT LEAVE
    // =========================
    async function updateLeaveStatus(id, status) {

        const action = status === "APPROVED" ? "approve" : "reject";

        if (!confirm(`Are you sure you want to ${action} this leave request?`)) {
            return;
        }

        try {

            const response = await fetch(`/leaves/hr/${id}/status`, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    status: status
                })
            });

            if (!response.ok) {
                throw new Error(await response.text());
            }

            alert(`Leave request ${action}d successfully!`);

            await loadLeaves();

        } catch (error) {

            console.error("Error updating leave status:", error);
            alert("Could not update leave status. Please check the backend.");

        }
    }

    // =========================
    // DELETE LEAVE
    // =========================
    async function deleteLeave(id) {

        if (!confirm("Are you sure you want to delete this leave record?")) {
            return;
        }

        try {

            const response = await fetch(`/leaves/hr/${id}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                throw new Error(await response.text());
            }

            alert("Leave deleted successfully!");

            await loadLeaves();

        } catch (error) {

            console.error("Error deleting leave:", error);
            alert("Could not delete leave. Please check the backend response.");

        }
    }

    // =========================
    // RESET FILTERS
    // =========================
    function resetFilters() {

        document.getElementById("employeeId").value = "";
        document.getElementById("statusFilter").value = "";
        document.getElementById("startDate").value = "";
        document.getElementById("endDate").value = "";

        loadLeaves();
    }

    // =========================
    // INITIAL LOAD
    // =========================
    document.addEventListener("DOMContentLoaded", loadLeaves);

</script>

</body>
</html>
