<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Employee Leaves - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    ```
    <h1>Employee Leaves</h1>

    <div class="card">

        <h2>Leave Records</h2>

        <button onclick="loadLeaves()">
            Show All
        </button>

        <br><br>

        <label>Employee ID:</label>

        <input
                type="number"
                id="employeeId"
                placeholder="Enter Employee ID">

        <button onclick="searchByEmployee()">
            Search
        </button>

        <br><br>

        <label>Status:</label>

        <select id="statusFilter">

            <option value="">
                Select Status
            </option>

            <option value="PENDING">
                Pending
            </option>

            <option value="APPROVED">
                Approved
            </option>

            <option value="REJECTED">
                Rejected
            </option>

            <option value="WITHDRAWN">
                Withdrawn
            </option>

        </select>

        <button onclick="searchByStatus()">
            Search
        </button>

        <br><br>

        <label>From Date:</label>

        <input
                type="date"
                id="startDate">


        <label>To Date:</label>

        <input
                type="date"
                id="endDate">

        <button onclick="searchBetweenDates()">
            Search
        </button>

        <button onclick="resetFilters()">
            Reset
        </button>

    </div>


    <br>


    <div class="card">

        <table border="1" width="100%" cellpadding="10">

            <thead>

            <tr>

                <th>Leave ID</th>
                <th>Employee ID</th>
                <th>From Date</th>
                <th>To Date</th>
                <th>Reason</th>
                <th>Status</th>
                <th>Action</th>

            </tr>

            </thead>


            <tbody id="leaveTable">

            </tbody>

        </table>

    </div>


    <br>


    <div class="dashboard-links">

        <a href="/hr-dashboard">
            Back to HR Dashboard
        </a>

    </div>
    ```

</div>

<script>

    // =========================
    // LOAD ALL LEAVES
    // =========================

    async function loadLeaves() {

        try {

            const response =
                await fetch("/leaves");


            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(errorText);

                throw new Error(
                    "Failed to fetch leaves"
                );
            }


            const leaves =
                await response.json();


            displayLeaves(leaves);

        } catch (error) {

            console.error(error);

            alert(
                "Error loading leaves."
            );
        }
    }


    // =========================
    // DISPLAY LEAVES
    // =========================

    function displayLeaves(leaves) {

        const table =
            document.getElementById(
                "leaveTable"
            );


        table.innerHTML = "";


        if (
            !leaves ||
            leaves.length === 0
        ) {

            table.innerHTML = `
                <tr>
                    <td colspan="7">
                        No leave records found.
                    </td>
                </tr>
            `;

            return;
        }


        leaves.forEach(leave => {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${leave.leaveId ?? ""}
                </td>

                <td>
                    ${
                leave.employee
                    ? leave.employee.employeeId
                    : ""
            }
                </td>

                <td>
                    ${leave.fromDate ?? ""}
                </td>

                <td>
                    ${leave.toDate ?? ""}
                </td>

                <td>
                    ${leave.reason ?? ""}
                </td>

                <td>
                    ${leave.status ?? ""}
                </td>

                <td>

                    <button
                        onclick="deleteLeave(
                            ${leave.leaveId}
                        )">

                        Delete

                    </button>

                </td>

            `;


            table.appendChild(row);

        });
    }


    // =========================
    // SEARCH BY EMPLOYEE
    // =========================

    async function searchByEmployee() {

        const employeeId =
            document.getElementById(
                "employeeId"
            ).value;


        if (!employeeId) {

            alert(
                "Please enter Employee ID."
            );

            return;
        }


        try {

            const response =
                await fetch(
                    `/leaves/employee/${employeeId}`
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(errorText);

                throw new Error(
                    "Failed to fetch employee leaves"
                );
            }


            const leaves =
                await response.json();


            displayLeaves(leaves);

        } catch (error) {

            console.error(error);

            alert(
                "Error searching employee leaves."
            );
        }
    }


    // =========================
    // SEARCH BY STATUS
    // =========================

    async function searchByStatus() {

        const status =
            document.getElementById(
                "statusFilter"
            ).value;


        if (!status) {

            alert(
                "Please select a status."
            );

            return;
        }


        try {

            const response =
                await fetch(
                    `/leaves/status?status=${encodeURIComponent(status)}`
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(errorText);

                throw new Error(
                    "Failed to fetch leaves"
                );
            }


            const leaves =
                await response.json();


            displayLeaves(leaves);

        } catch (error) {

            console.error(error);

            alert(
                "Error searching leaves."
            );
        }
    }


    // =========================
    // SEARCH BETWEEN DATES
    // =========================

    async function searchBetweenDates() {

        const startDate =
            document.getElementById(
                "startDate"
            ).value;


        const endDate =
            document.getElementById(
                "endDate"
            ).value;


        if (!startDate || !endDate) {

            alert(
                "Please select both dates."
            );

            return;
        }


        try {

            const response =
                await fetch(
                    `/leaves/between?startDate=${startDate}&endDate=${endDate}`
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(errorText);

                throw new Error(
                    "Failed to fetch leaves"
                );
            }


            const leaves =
                await response.json();


            displayLeaves(leaves);

        } catch (error) {

            console.error(error);

            alert(
                "Error searching leaves."
            );
        }
    }


    // =========================
    // DELETE LEAVE
    // =========================

    async function deleteLeave(id) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this leave record?"
            );


        if (!confirmed) {

            return;
        }


        try {

            const response =
                await fetch(
                    `/leaves/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(errorText);

                throw new Error(
                    "Failed to delete leave"
                );
            }


            alert(
                "Leave deleted successfully!"
            );


            loadLeaves();

        } catch (error) {

            console.error(error);

            alert(
                "Error deleting leave."
            );
        }
    }


    // =========================
    // RESET FILTERS
    // =========================

    function resetFilters() {

        document.getElementById(
            "employeeId"
        ).value = "";


        document.getElementById(
            "statusFilter"
        ).value = "";


        document.getElementById(
            "startDate"
        ).value = "";


        document.getElementById(
            "endDate"
        ).value = "";


        loadLeaves();
    }


    // =========================
    // INITIAL LOAD
    // =========================

    loadLeaves();

</script>

</body>

</html>
