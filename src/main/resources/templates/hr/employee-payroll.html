<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Payroll - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="container">

    <h1>Employee Payroll</h1>

    <!-- ADD / EDIT PAYROLL -->
    <div class="card">
        <h2 id="formTitle">Add Payroll</h2>

        <form id="payrollForm">
            <input type="hidden" id="payrollId">

            <label>Employee:</label>
            <select id="formEmployeeId" required>
                <option value="">Select Employee</option>
            </select>

            <label>Pay Month:</label>
            <input type="text" id="formPayMonth"
                   placeholder="September 2026" required>

            <label>Basic Salary:</label>
            <input type="number" id="basicSalary"
                   min="0" step="0.01" required>

            <label>Allowances:</label>
            <input type="number" id="allowances"
                   min="0" step="0.01" required>

            <label>Deductions:</label>
            <input type="number" id="deductions"
                   min="0" step="0.01" required>

            <label>Net Salary:</label>
            <input type="number" id="netSalary" readonly>

            <label>Payment Date:</label>
            <input type="date" id="formPaymentDate">

            <br><br>
            <button type="submit" id="saveButton">Add Payroll</button>
            <button type="button" onclick="resetForm()">Clear</button>
        </form>
    </div>

    <!-- SEARCH -->
    <div class="card">
        <h2>Search Payroll</h2>

        <label>Employee ID:</label>
        <input type="number" id="employeeId">
        <button type="button" onclick="searchByEmployee()">Search</button>

        <br><br>

        <label>Pay Month:</label>
        <input type="text" id="payMonth"
               placeholder="September 2026">
        <button type="button" onclick="searchByMonth()">Search</button>

        <br><br>

        <label>Employee ID:</label>
        <input type="number" id="employeeMonthId">

        <label>Pay Month:</label>
        <input type="text" id="employeeMonth"
               placeholder="September 2026">

        <button type="button" onclick="searchEmployeeMonth()">Search</button>

        <br><br>

        <label>Payment Date:</label>
        <input type="date" id="paymentDate">
        <button type="button" onclick="searchByPaymentDate()">Search</button>

        <br><br>
        <button type="button" onclick="loadPayrolls()">Show All</button>
    </div>

    <!-- PAYROLL TABLE -->
    <div class="card">
        <h2>Payroll Records</h2>

        <table border="1" width="100%" cellpadding="10">
            <thead>
            <tr>
                <th>Payroll ID</th>
                <th>Employee ID</th>
                <th>Pay Month</th>
                <th>Basic Salary</th>
                <th>Allowances</th>
                <th>Deductions</th>
                <th>Net Salary</th>
                <th>Payment Date</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="payrollTableBody"></tbody>
        </table>
    </div>
</div>

<div>
    <a href="/hr-dashboard">
        <button type="button">Back to Dashboard</button>
    </a>
</div>

<br>

<script>
    const api = "/payrolls";

    // Payroll records loaded from the HR-specific endpoint
    let hrPayrolls = [];

    // Automatically calculate net salary
    function calculateNetSalary() {
        const basic = Number(document.getElementById("basicSalary").value) || 0;
        const allowances = Number(document.getElementById("allowances").value) || 0;
        const deductions = Number(document.getElementById("deductions").value) || 0;

        document.getElementById("netSalary").value =
            Math.max(0, basic + allowances - deductions).toFixed(2);
    }

    ["basicSalary", "allowances", "deductions"].forEach(id => {
        document.getElementById(id).addEventListener("input", calculateNetSalary);
    });

    // ADD OR UPDATE PAYROLL
    document.getElementById("payrollForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        const id = document.getElementById("payrollId").value;
        const employeeId = Number(document.getElementById("formEmployeeId").value);
        const basic = Number(document.getElementById("basicSalary").value);
        const allowances = Number(document.getElementById("allowances").value);
        const deductions = Number(document.getElementById("deductions").value);
        const payMonth = document.getElementById("formPayMonth").value.trim();
        const netSalary = basic + allowances - deductions;

        if (!employeeId) {
            alert("Please select an employee.");
            return;
        }

        if (netSalary < 0) {
            alert("Deductions cannot exceed basic salary plus allowances.");
            return;
        }

        if (!payMonth) {
            alert("Please enter the pay month.");
            return;
        }

        // Only allow editing records currently present in this HR's scoped list.
        if (id && !hrPayrolls.some(p => String(p.payrollId) === String(id))) {
            alert("You cannot edit this payroll record from this HR account.");
            return;
        }

        // Only allow selecting an employee currently returned by the HR employee endpoint.
        const employeeIsAssigned = Array.from(
            document.getElementById("formEmployeeId").options
        ).some(option => option.value === String(employeeId));

        if (!employeeIsAssigned) {
            alert("Please select an employee assigned to you.");
            return;
        }

        const payroll = {
            employee: { employeeId: employeeId },
            payMonth: payMonth,
            basicSalary: basic,
            allowances: allowances,
            deductions: deductions,
            netSalary: netSalary,
            paymentDate: document.getElementById("formPaymentDate").value || null
        };

        try {
            const response = await fetch(
                id ? `${api}/${id}` : api,
                {
                    method: id ? "PUT" : "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payroll)
                }
            );

            if (!response.ok) {
                throw new Error(await response.text());
            }

            alert(id ? "Payroll updated successfully." : "Payroll added successfully.");
            resetForm();
            await loadPayrolls();
        } catch (error) {
            console.error(error);
            alert("Unable to save payroll. Check the backend logs.");
        }
    });

    // LOAD PAYROLLS FOR ACTIVE EMPLOYEES ASSIGNED TO THE CURRENT HR
    async function loadPayrolls() {
        try {
            const response = await fetch("/payrolls/hr/my-employees");

            if (!response.ok) {
                throw new Error("Failed to load HR payrolls");
            }

            hrPayrolls = await response.json();
            displayPayrolls(hrPayrolls);
        } catch (error) {
            console.error(error);
            alert("Failed to load payroll records.");
        }
    }

    // SEARCH EMPLOYEE
    function searchByEmployee() {
        const id = document.getElementById("employeeId").value.trim();

        if (!id) {
            alert("Please enter Employee ID");
            return;
        }

        displayPayrolls(
            hrPayrolls.filter(p =>
                String(p.employee?.employeeId ?? p.employeeId ?? "") === id
            )
        );
    }

    // SEARCH BY MONTH
    function searchByMonth() {
        const month = document.getElementById("payMonth").value.trim();

        if (!month) {
            alert("Please enter Pay Month");
            return;
        }

        displayPayrolls(
            hrPayrolls.filter(p =>
                String(p.payMonth ?? "").toLowerCase() === month.toLowerCase()
            )
        );
    }

    // SEARCH BY EMPLOYEE AND MONTH
    function searchEmployeeMonth() {
        const id = document.getElementById("employeeMonthId").value.trim();
        const month = document.getElementById("employeeMonth").value.trim();

        if (!id || !month) {
            alert("Please enter Employee ID and Pay Month");
            return;
        }

        displayPayrolls(
            hrPayrolls.filter(p =>
                String(p.employee?.employeeId ?? p.employeeId ?? "") === id &&
                String(p.payMonth ?? "").toLowerCase() === month.toLowerCase()
            )
        );
    }

    // SEARCH BY PAYMENT DATE
    function searchByPaymentDate() {
        const date = document.getElementById("paymentDate").value;

        if (!date) {
            alert("Please select Payment Date");
            return;
        }

        displayPayrolls(
            hrPayrolls.filter(p =>
                String(p.paymentDate ?? "").slice(0, 10) === date
            )
        );
    }

    // DISPLAY PAYROLLS
    function displayPayrolls(payrolls) {
        const body = document.getElementById("payrollTableBody");
        body.innerHTML = "";

        if (!payrolls || payrolls.length === 0) {
            body.innerHTML =
                '<tr><td colspan="9">No payroll records found</td></tr>';
            return;
        }

        payrolls.forEach(p => {
            const employeeId = p.employee?.employeeId ?? p.employeeId ?? "-";
            const row = document.createElement("tr");

            [
                p.payrollId ?? "-",
                employeeId,
                p.payMonth ?? "-",
                p.basicSalary ?? "-",
                p.allowances ?? "-",
                p.deductions ?? "-",
                p.netSalary ?? "-",
                p.paymentDate ? String(p.paymentDate).slice(0, 10) : "-"
            ].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            const actions = document.createElement("td");

            const editButton = document.createElement("button");
            editButton.textContent = "Edit";
            editButton.type = "button";
            editButton.addEventListener("click", () => editPayroll(p));

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.type = "button";
            deleteButton.addEventListener("click", () => deletePayroll(p.payrollId));

            actions.append(editButton, deleteButton);
            row.appendChild(actions);
            body.appendChild(row);
        });
    }

    // LOAD RECORD INTO FORM
    function editPayroll(p) {
        if (!hrPayrolls.some(record =>
            String(record.payrollId) === String(p.payrollId))) {
            alert("You cannot edit this payroll record.");
            return;
        }

        document.getElementById("payrollId").value = p.payrollId;
        document.getElementById("formEmployeeId").value =
            p.employee?.employeeId ?? p.employeeId ?? "";
        document.getElementById("formPayMonth").value = p.payMonth ?? "";
        document.getElementById("basicSalary").value = p.basicSalary ?? 0;
        document.getElementById("allowances").value = p.allowances ?? 0;
        document.getElementById("deductions").value = p.deductions ?? 0;
        document.getElementById("formPaymentDate").value =
            p.paymentDate ? String(p.paymentDate).slice(0, 10) : "";

        calculateNetSalary();

        document.getElementById("formTitle").textContent = "Edit Payroll";
        document.getElementById("saveButton").textContent = "Update Payroll";

        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // DELETE PAYROLL
    async function deletePayroll(id) {
        if (!hrPayrolls.some(p => String(p.payrollId) === String(id))) {
            alert("You cannot delete this payroll record.");
            return;
        }

        if (!confirm("Are you sure you want to delete this payroll record?")) {
            return;
        }

        try {
            const response = await fetch(`${api}/${id}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                throw new Error(await response.text());
            }

            alert("Payroll deleted successfully.");
            await loadPayrolls();
        } catch (error) {
            console.error(error);
            alert("Failed to delete payroll record.");
        }
    }

    // RESET FORM
    function resetForm() {
        document.getElementById("payrollForm").reset();
        document.getElementById("payrollId").value = "";
        document.getElementById("formTitle").textContent = "Add Payroll";
        document.getElementById("saveButton").textContent = "Add Payroll";
        calculateNetSalary();
    }

    // LOAD ACTIVE EMPLOYEES ASSIGNED TO THE CURRENT HR
    async function loadHrEmployees() {
        try {
            const response = await fetch("/employees/hr/my-employees");

            if (!response.ok) {
                throw new Error("Failed to load HR employees");
            }

            const employees = await response.json();
            const select = document.getElementById("formEmployeeId");

            select.innerHTML = '<option value="">Select Employee</option>';

            employees.forEach(employee => {
                const option = document.createElement("option");
                option.value = employee.employeeId;

                const name = employee.firstName && employee.lastName
                    ? `${employee.firstName} ${employee.lastName}`
                    : employee.firstName || employee.name || "";

                option.textContent =
                    `Employee ${employee.employeeId}${name ? " - " + name : ""}`;

                select.appendChild(option);
            });
        } catch (error) {
            console.error(error);
            alert("Failed to load your employees.");
        }
    }

    loadHrEmployees();
    loadPayrolls();
</script>
</body>
</html>
