<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Employees | Employee Management System</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Employee Management</h1>

    <!-- SEARCH -->
    <div class="card">
        <h2>Search Employee</h2>

        <input
                type="text"
                id="searchName"
                placeholder="Enter employee name">

        <button class="btn" onclick="searchEmployees()">
            Search
        </button>

        <button class="btn" onclick="loadEmployees()">
            Show All
        </button></div>

    <br>

    <!-- ADD / EDIT FORM -->
    <div class="card" id="employeeFormCard" style="display: none;">

        <h2 id="formTitle">Edit Employee</h2>

        <form id="employeeForm">

            <input type="hidden" id="employeeId">

            <label for="firstName">First Name</label>
            <input type="text" id="firstName" required>

            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="phone">Phone</label>
            <input type="text" id="phone">

            <label for="dateOfBirth">Date of Birth</label>
            <input type="date" id="dateOfBirth">

            <label for="hireDate">Hire Date</label>
            <input type="date" id="hireDate" required>

            <label for="address">Address</label>
            <textarea id="address" rows="3"></textarea>

            <label for="departmentId">Department</label>
            <select id="departmentId" required>
                <option value="">Select Department</option>
            </select>

            <label for="designationId">Designation</label>
            <select id="designationId" required>
                <option value="">Select Designation</option>
            </select>

            <label for="managerId">Manager</label>
            <select id="managerId">
                <option value="">None</option>
            </select>

            <label for="hrName">Assigned HR</label>
            <input type="text" id="hrName" readonly>
            <input type="hidden" id="hrId">

            <br><br>

            <button type="submit" class="btn">
                Save Employee
            </button>

            <button
                    type="button"
                    class="btn"
                    onclick="hideEmployeeForm()">
                Cancel
            </button>

        </form>

        <p id="formMessage"></p>

    </div>

    <br>

    <!-- EMPLOYEE LIST -->
    <div class="card">
        <div id="employees">
            <p class="loading">Loading employees...</p>
        </div>
    </div>

    <br>

    <a class="back-link" href="/hr-dashboard">
        ← Back to HR Dashboard
    </a>

</div>

<script>

    // ==========================================
    // DISPLAY EMPLOYEES
    // ==========================================

    function displayEmployees(employees) {
        const container = document.getElementById("employees");
        container.replaceChildren();

        if (!Array.isArray(employees) || employees.length === 0) {
            const empty = document.createElement("p");
            empty.className = "empty-message";
            empty.textContent = "No employees found.";
            container.appendChild(empty);
            return;
        }

        const table = document.createElement("table");
        const head = document.createElement("thead");
        const headerRow = document.createElement("tr");
        ["Employee ID", "First Name", "Last Name", "Email", "Phone", "Hire Date", "Actions"]
            .forEach(label => {
                const th = document.createElement("th");
                th.textContent = label;
                headerRow.appendChild(th);
            });
        head.appendChild(headerRow);
        table.appendChild(head);

        const body = document.createElement("tbody");
        employees.forEach(employee => {
            const row = document.createElement("tr");
            [employee.employeeId, employee.firstName, employee.lastName, employee.email, employee.phone, employee.hireDate]
                .forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value == null || value === "" ? "—" : String(value);
                    row.appendChild(cell);
                });

            const actions = document.createElement("td");
            const view = document.createElement("button");
            view.type = "button";
            view.className = "btn-small";
            view.textContent = "View";
            view.addEventListener("click", () => viewEmployee(employee.employeeId));

            const edit = document.createElement("button");
            edit.type = "button";
            edit.className = "btn-small";
            edit.textContent = "Edit";
            edit.addEventListener("click", () => editEmployee(employee.employeeId));

            actions.append(view, edit);
            row.appendChild(actions);
            body.appendChild(row);
        });
        table.appendChild(body);

        const responsive = document.createElement("div");
        responsive.className = "table-responsive";
        responsive.appendChild(table);
        container.appendChild(responsive);
    }

    // ==========================================
    // GET LOGGED-IN HR
    // ==========================================

    async function getCurrentHR() {

        const response = await fetch("/employees/me");

        if (!response.ok) {
            throw new Error("Unable to identify the logged-in HR");
        }

        return await response.json();
    }


    // ==========================================
    // LOAD ACTIVE EMPLOYEES ASSIGNED TO CURRENT HR
    // ==========================================

    async function loadEmployees() {

        const container = document.getElementById("employees");

        container.innerHTML =
            "<p class='loading'>Loading employees...</p>";

        try {

            // HR-specific endpoint uses get_employees_by_hr().
            // Its SQL function must filter u.is_active = TRUE.
            const response = await fetch("/employees/hr/my-employees");

            if (!response.ok) {
                throw new Error("Failed to load HR employees");
            }

            const employees = await response.json();

            displayEmployees(employees);

        } catch (error) {

            console.error(error);

            container.innerHTML =
                "<p class='error-message'>Failed to load employees.</p>";
        }
    }


    // ==========================================
    // SEARCH ACTIVE EMPLOYEES ASSIGNED TO CURRENT HR
    // ==========================================

    async function searchEmployees() {

        const name = document.getElementById("searchName")
            .value.trim().toLowerCase();

        if (!name) {
            await loadEmployees();
            return;
        }

        const container = document.getElementById("employees");

        container.innerHTML =
            "<p class='loading'>Searching...</p>";

        try {

            // Search within the HR's active employee list.
            const response = await fetch("/employees/hr/my-employees");

            if (!response.ok) {
                throw new Error("Failed to search employees");
            }

            const employees = await response.json();

            const filteredEmployees = employees.filter(employee => {

                const fullName =
                    `${employee.firstName ?? ""} ${employee.lastName ?? ""}`
                        .toLowerCase();

                return fullName.includes(name);
            });

            displayEmployees(filteredEmployees);

        } catch (error) {

            console.error(error);

            container.innerHTML =
                "<p class='error-message'>Unable to search employees.</p>";
        }
    }


    // ==========================================
    // VIEW EMPLOYEE
    // ==========================================

    function viewEmployee(employeeId) {
        window.location.href = `/hr/employees/${employeeId}`;
    }


    // ==========================================
    // LOAD FORM DROPDOWN OPTIONS
    // ==========================================

    let formOptionsPromise = null;

    async function loadFormOptions() {

        if (formOptionsPromise) {
            return await formOptionsPromise;
        }

        formOptionsPromise = (async function () {

            const [
                departmentResponse,
                designationResponse,
                managersResponse,
                currentHR
            ] = await Promise.all([
                fetch("/departments"),
                fetch("/designations"),
                fetch("/employees/managers"),
                getCurrentHR()
            ]);

            if (
                !departmentResponse.ok ||
                !designationResponse.ok ||
                !managersResponse.ok
            ) {
                throw new Error("Failed to load form options");
            }

            const departments = await departmentResponse.json();
            const designations = await designationResponse.json();
            const managers = await managersResponse.json();

            // DEPARTMENT DROPDOWN
            document.getElementById("departmentId").innerHTML =
                '<option value="">Select Department</option>' +
                departments.map(department => `
                    <option value="${department.departmentId}">
                        ${department.departmentId} - ${department.departmentName}
                    </option>
                `).join("");

            // DESIGNATION DROPDOWN
            document.getElementById("designationId").innerHTML =
                '<option value="">Select Designation</option>' +
                designations.map(designation => `
                    <option value="${designation.designationId}">
                        ${designation.designationId} - ${designation.designationTitle}
                    </option>
                `).join("");

            // MANAGER DROPDOWN
            // Uses the managers endpoint, which returns active Manager-role users.
            document.getElementById("managerId").innerHTML =
                '<option value="">None</option>' +
                managers.map(manager => `
                    <option value="${manager.employeeId}">
                        ${manager.employeeId} - ${manager.firstName} ${manager.lastName}
                    </option>
                `).join("");

            // CURRENT HR
            document.getElementById("hrId").value =
                currentHR.employeeId;

            document.getElementById("hrName").value =
                `${currentHR.employeeId} - ${currentHR.firstName} ${currentHR.lastName}`;

        })().catch(error => {

            formOptionsPromise = null;
            throw error;

        });

        return await formOptionsPromise;
    }


    // ==========================================
    // SHOW ADD FORM
    // ==========================================

    // ==========================================
    // HIDE FORM
    // ==========================================

    function hideEmployeeForm() {

        document.getElementById("employeeFormCard").style.display =
            "none";
    }


    // ==========================================
    // EDIT EMPLOYEE
    // ==========================================

    async function editEmployee(employeeId) {

        try {

            await loadFormOptions();

            const response = await fetch(`/employees/${employeeId}`);

            if (!response.ok) {
                throw new Error("Failed to load employee details");
            }

            const employee = await response.json();

            document.getElementById("employeeId").value =
                employee.employeeId ?? "";

            document.getElementById("firstName").value =
                employee.firstName ?? "";

            document.getElementById("lastName").value =
                employee.lastName ?? "";

            document.getElementById("email").value =
                employee.email ?? "";

            document.getElementById("phone").value =
                employee.phone ?? "";

            document.getElementById("dateOfBirth").value =
                employee.dateOfBirth ?? "";

            document.getElementById("hireDate").value =
                employee.hireDate ?? "";

            document.getElementById("address").value =
                employee.address ?? "";

            document.getElementById("departmentId").value =
                employee.department?.departmentId ?? "";

            document.getElementById("designationId").value =
                employee.designation?.designationId ?? "";

            document.getElementById("managerId").value =
                employee.managerId ?? "";

            // Keep the assigned HR as the currently logged-in HR.
            const currentHR = await getCurrentHR();

            document.getElementById("hrId").value =
                currentHR.employeeId;

            document.getElementById("hrName").value =
                `${currentHR.employeeId} - ${currentHR.firstName} ${currentHR.lastName}`;

            document.getElementById("formTitle").textContent =
                "Edit Employee";

            document.getElementById("formMessage").textContent = "";

            document.getElementById("employeeFormCard").style.display =
                "block";

            document.getElementById("employeeFormCard").scrollIntoView({
                behavior: "smooth"
            });

        } catch (error) {

            alert("Unable to load employee details.");
            console.error(error);
        }
    }


    // ==========================================
    // ADD / UPDATE EMPLOYEE
    // ==========================================

    document.getElementById("employeeForm").addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const employeeId =
                document.getElementById("employeeId").value;

            const departmentId =
                document.getElementById("departmentId").value;

            const designationId =
                document.getElementById("designationId").value;

            const managerId =
                document.getElementById("managerId").value;

            const hrId =
                document.getElementById("hrId").value;

            const employee = {

                firstName:
                    document.getElementById("firstName").value.trim(),

                lastName:
                    document.getElementById("lastName").value.trim(),

                email:
                    document.getElementById("email").value.trim(),

                phone:
                    document.getElementById("phone").value.trim() || null,

                dateOfBirth:
                    document.getElementById("dateOfBirth").value || null,

                hireDate:
                document.getElementById("hireDate").value,

                address:
                    document.getElementById("address").value.trim() || null,

                department: departmentId
                    ? { departmentId: Number(departmentId) }
                    : null,

                designation: designationId
                    ? { designationId: Number(designationId) }
                    : null,

                managerId: managerId
                    ? Number(managerId)
                    : null,

                hrId: hrId
                    ? Number(hrId)
                    : null
            };

            if (!employeeId) {
                message.textContent = "Only an administrator can add employees. HR can edit existing employee records.";
                return;
            }

            const url = `/employees/${employeeId}`;
            const method = "PUT";

            const message = document.getElementById("formMessage");

            try {

                message.textContent = "Saving employee...";

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(employee)
                });

                if (!response.ok) {

                    throw new Error(response.status === 401 ? "Your session has expired. Please sign in again." : response.status === 403 ? "Your account is not permitted to update this employee." : response.status >= 500 ? "The server could not save the employee. Please try again or contact the administrator." : "The employee details were not accepted. Review the fields and try again.");
                }

                alert(
                    "Employee updated successfully."
                );

                hideEmployeeForm();
                await loadEmployees();

            } catch (error) {

                message.textContent =
                    "Unable to save employee. " + error.message;

            }
        }
    );


    // ==========================================
    // INITIAL LOAD
    // ==========================================

    loadEmployees();

</script>


<script th:src="@{/theme.js}" defer></script>
</body>
</html>
