<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>HR Payroll - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>My Payroll</h1>

    <div class="card" id="payroll">
        <p class="loading">Loading payroll...</p>
    </div>

    <br>

    <a class="back-link" href="/hr-dashboard">
        ← Back to HR Dashboard
    </a>

</div>

<script>
    fetch('/payrolls/me')
        .then(response => {
            if (!response.ok) {
                throw new Error("Failed to load payroll");
            }

            return response.json();
        })

        .then(payroll => {
            const container = document.getElementById("payroll");

            if (!payroll || payroll.length === 0) {
                container.innerHTML =
                    "<p>No payroll records found.</p>";
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Payroll ID</th>
                            <th>Month</th>
                            <th>Year</th>
                            <th>Basic Salary</th>
                            <th>Allowances</th>
                            <th>Deductions</th>
                            <th>Net Salary</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            payroll.forEach(record => {
                const payPeriod = record.payMonth ?? "";
                const periodParts = payPeriod.match(/^(.+?)\s+(\d{4})$/);

                const month = periodParts ? periodParts[1] : "N/A";
                const year = periodParts ? periodParts[2] : "N/A";

                html += `
                    <tr>
                        <td>${record.payrollId ?? "N/A"}</td>
                        <td>${month}</td>
                        <td>${year}</td>
                        <td>${record.basicSalary ?? "N/A"}</td>
                        <td>${record.allowances ?? "N/A"}</td>
                        <td>${record.deductions ?? "N/A"}</td>
                        <td>${record.netSalary ?? "N/A"}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        })

        .catch(error => {
            document.getElementById("payroll").innerHTML =
                "<p class='error-message'>Unable to load payroll.</p>";

            console.error(error);
        });
</script>

</body>
</html>
