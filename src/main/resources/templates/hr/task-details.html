<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Task Details - StaffSync</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Task Details</h1>

    <div class="card">

        <p>
            <strong>Task ID:</strong>
            <span id="taskId"></span>
        </p>

        <p>
            <strong>Task Name:</strong>
            <span id="taskName"></span>
        </p>

        <p>
            <strong>Description:</strong>
            <span id="description"></span>
        </p>

        <p>
            <strong>Priority:</strong>
            <span id="priority"></span>
        </p>

        <p>
            <strong>Status:</strong>
            <span id="status"></span>
        </p>

        <p>
            <strong>Start Date:</strong>
            <span id="startDate"></span>
        </p>

        <p>
            <strong>Due Date:</strong>
            <span id="dueDate"></span>
        </p>

        <p>
            <strong>Project ID:</strong>
            <span id="projectId"></span>
        </p>

        <p>
            <strong>Employee ID:</strong>
            <span id="employeeId"></span>
        </p>

    </div>


    <div class="dashboard-links">

        <a id="editLink">
            Edit Task
        </a>

        <a href="/hr/tasks">
            Back to Tasks
        </a>

        <a href="/hr-dashboard">
            Back to HR Dashboard
        </a>

    </div>

</div>


<script>

    // =========================
    // GET TASK ID FROM URL
    // =========================

    const pathParts =
        window.location.pathname.split("/");

    const taskId =
        pathParts[3];

    console.log("Task ID:", taskId);


    // =========================
    // LOAD TASK
    // =========================

    async function loadTask() {

        try {

            const response =
                await fetch(
                    `/tasks/${taskId}`
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(errorText);

                throw new Error(
                    "Failed to fetch task"
                );
            }


            const task =
                await response.json();


            document.getElementById(
                "taskId"
            ).textContent =
                task.taskId ?? "-";


            document.getElementById(
                "taskName"
            ).textContent =
                task.taskName ?? "-";


            document.getElementById(
                "description"
            ).textContent =
                task.description ?? "-";


            document.getElementById(
                "priority"
            ).textContent =
                task.priority ?? "-";


            document.getElementById(
                "status"
            ).textContent =
                task.status ?? "-";


            document.getElementById(
                "startDate"
            ).textContent =
                task.startDate ?? "-";


            document.getElementById(
                "dueDate"
            ).textContent =
                task.dueDate ?? "-";


            document.getElementById(
                "projectId"
            ).textContent =
                task.project
                    ? task.project.projectId
                    : "-";


            document.getElementById(
                "employeeId"
            ).textContent =
                task.assignedTo
                    ? task.assignedTo.employeeId
                    : "-";


            document.getElementById(
                "editLink"
            ).href =
                `/hr/tasks/${taskId}/edit`;


        } catch (error) {

            console.error(error);

            alert(
                "Error loading task details."
            );
        }
    }


    // =========================
    // INITIAL LOAD
    // =========================

    loadTask();

</script>

</body>

</html>
