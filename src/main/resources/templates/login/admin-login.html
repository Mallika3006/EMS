<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Employee Management System</title>

    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="login-panel"><section class="login-container" aria-labelledby="login-heading">

    <h2 id="login-heading">Administrator sign in</h2><p class="subtitle">Sign in using your administrator account.</p>

    <p id="error-message" class="error-message" role="alert" aria-live="polite"></p>

    <form id="loginForm">

        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" autocomplete="username" required>
        </div>

        <br>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <br>

        <button type="submit" id="loginButton">Login</button>

    </form>

    <p class="registration-login-link"><a th:href="@{/forgot-password}">Forgot your password?</a></p>

</section></div>
<script>
    document.getElementById("loginForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            const errorMessage =
                document.getElementById("error-message");

            const loginButton =
                document.getElementById("loginButton");

            errorMessage.textContent = new URLSearchParams(window.location.search).has("expired")
                ? "Your session has expired or you are signed out. Please sign in again."
                : "";
            loginButton.disabled = true;

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                if (!response.ok) {
                    throw new Error("The username or password is incorrect.");
                }

                const data = await response.json();

                // Only ADMIN can use Admin Login
                if (data.role !== "ROLE_ADMIN") {
                    errorMessage.textContent =
                        "Only Admin users can login here.";
                    return;
                }

                // JWT is held in the HttpOnly cookie set by the server.
                // The role is used only for this redirect; authentication stays in the HttpOnly cookie.

                // Cookie is set by LoginController
                window.location.href = "/admin-dashboard";

            } catch (error) {
                errorMessage.textContent = error instanceof Error ? error.message : "Sign-in failed. Please try again.";
            } finally {
                loginButton.disabled = false;
            }
        });
</script>


<script th:src="@{/theme.js}" defer></script>
</body>
</html>
