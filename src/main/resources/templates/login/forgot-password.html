<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password | Employee Management System</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><main class="login-panel"><section class="login-container" aria-labelledby="reset-heading">
<a th:href="@{/login}">← Back to sign in</a><h2 id="reset-heading">Reset your password</h2>
<p class="subtitle">Receive a one-time code using the recovery contact registered to your account.</p>
<p id="recovery-message" class="error-message" role="status" aria-live="polite"></p>
<form id="requestForm"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required>
<label for="channel">Send code by</label><select id="channel" name="channel"><option value="EMAIL">Registered email</option><option value="SMS">Registered mobile (SMS)</option></select><button type="submit">Send OTP</button></form>
<form id="verifyForm" hidden><label for="otp">One-time password</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button type="submit">Verify OTP</button></form>
<form id="resetForm" hidden><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="10" maxlength="72" autocomplete="new-password" required><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="10" maxlength="72" autocomplete="new-password" required><button type="submit">Reset password</button></form>
</section></main>
<script>
(()=>{const msg=document.getElementById("recovery-message"),req=document.getElementById("requestForm"),ver=document.getElementById("verifyForm"),reset=document.getElementById("resetForm"),user=document.getElementById("username"),channel=document.getElementById("channel");let resetToken="";
async function post(path,data){const r=await fetch(path,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw new Error(d.message||"Request failed.");return d;}
req.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="";try{const d=await post("/api/password-recovery/request",{username:user.value.trim(),channel:channel.value});msg.textContent=d.message;ver.hidden=false;document.getElementById("otp").focus();}catch(x){msg.textContent=x instanceof Error?x.message:"Could not request an OTP."; }});
ver.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="";try{const d=await post("/api/password-recovery/verify",{username:user.value.trim(),channel:channel.value,otp:document.getElementById("otp").value.trim()});resetToken=d.resetToken;msg.textContent=d.message;reset.hidden=false;document.getElementById("newPassword").focus();}catch(x){msg.textContent=x instanceof Error?x.message:"OTP verification failed."; }});
reset.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="";try{const d=await post("/api/password-recovery/reset",{resetToken,newPassword:document.getElementById("newPassword").value,confirmPassword:document.getElementById("confirmPassword").value});msg.className="success-message";msg.textContent=d.message;req.hidden=true;ver.hidden=true;reset.hidden=true;window.setTimeout(()=>window.location.assign("/login"),1200);}catch(x){msg.textContent=x instanceof Error?x.message:"Password reset failed."; }});
})();
</script><script th:src="@{/theme.js}" defer></script></body></html>
