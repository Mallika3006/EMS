<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>User Login | Employee Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<main class="login-panel"><section class="login-container" aria-labelledby="login-heading">

    <h2 id="login-heading">Welcome back</h2><p class="subtitle">Sign in to your EMS account.</p>

    <p id="error-message" class="error-message" role="alert" aria-live="polite"></p>

    <form id="loginForm">

        <div>
            <label for="username">Username:</label>

            <input type="text" id="username" name="username" autocomplete="username" required>
        </div>

        <br>

        <div>
            <label for="password">Password:</label>

            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <br>

        <button type="submit">Login</button>

    </form>

    <p class="registration-login-link"><a th:href="@{/forgot-password}">Forgot your password?</a></p>

</section></main>
<script>

    document.getElementById("loginForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            const errorMessage =
                document.getElementById("error-message");

            errorMessage.textContent = "";

            try {

                // ==========================================
                // LOGIN REQUEST
                // ==========================================

                const response = await fetch("/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })

                });

                const data =
                    await response.json();


                // ==========================================
                // LOGIN FAILED
                // ==========================================

                if (!response.ok) {

                    errorMessage.textContent =
                        "Invalid username or password.";

                    return;
                }


                // ==========================================
                // ADMIN CANNOT USE USER LOGIN
                // ==========================================

                if (data.role === "ROLE_ADMIN") {

                    errorMessage.textContent =
                        "Admin users must use Admin Login.";

                    return;
                }


                // ==========================================
                // CHECK USER ROLE
                // ==========================================

                if (
                    data.role !== "ROLE_EMPLOYEE" &&
                    data.role !== "ROLE_HR" &&
                    data.role !== "ROLE_MANAGER"
                ) {

                    errorMessage.textContent =
                        "Invalid user role.";

                    return;
                }


                // Store role for frontend use
                // Authentication remains in the server-issued HttpOnly cookie.



                // ==========================================
                // REDIRECT BASED ON ROLE
                // ==========================================

                if (data.role === "ROLE_HR") {

                    window.location.href =
                        "/hr-dashboard";

                }

                else if (data.role === "ROLE_MANAGER") {

                    window.location.href =
                        "/manager-dashboard";

                }

                else {

                    window.location.href =
                        "/employee-dashboard";
                }

            }

            catch (error) {

                // Do not log authentication data in the browser console.

                errorMessage.textContent =
                    "Login request failed.";

            }

        });

</script>


<script th:src="@{/theme.js}" defer></script>
</body>

</html>
