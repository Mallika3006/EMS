<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Team Attendance | Employee Management System</title><link rel="stylesheet" href="/style.css">
    <style>
        .filters,.form-grid,.summary{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:14px 0}
        .form-grid label,.filters label{display:grid;gap:5px}
        .summary>div{padding:14px;border:1px solid #ddd;border-radius:9px;min-width:120px}
        .table-wrap{overflow-x:auto}#feedback{margin:12px 0}
    </style>
</head>
<body>
<div class="container">
    <h1>Team Attendance</h1>
    <p>Review attendance for active team members in your company and add a correction when required.</p>
    <section class="card">
        <h2>Add attendance record</h2>
        <form id="attendanceForm">
            <div class="form-grid">
                <label>Employee<select id="employeeId" required><option value="">Loading team…</option></select></label>
                <label>Date<input type="date" id="attDate" required></label>
                <label>Status<select id="status" required><option>Present</option><option>Absent</option><option>Late</option><option>Leave</option></select></label>
                <label>Check in<input type="time" id="checkInTime"></label>
                <label>Check out<input type="time" id="checkOutTime"></label>
                <button type="submit" id="saveButton">Add attendance</button>
            </div>
        </form>
        <p id="feedback" role="status" aria-live="polite"></p>
    </section>
    <section class="card">
        <h2>Team attendance report</h2>
        <div class="summary"><div>Records<strong id="recordCount">0</strong></div><div>Present<strong id="presentCount">0</strong></div><div>Absent<strong id="absentCount">0</strong></div><div>Late<strong id="lateCount">0</strong></div></div>
        <div class="filters">
            <label>From date<input type="date" id="fromDate"></label><label>To date<input type="date" id="toDate"></label>
            <label>Status<select id="statusFilter"><option value="">All statuses</option><option>Present</option><option>Absent</option><option>Late</option><option>Leave</option></select></label>
            <button type="button" id="applyFilter">Apply filters</button><button type="button" id="resetFilter">Reset</button>
            <button type="button" id="exportButton">Export CSV</button><button type="button" id="refreshButton">Refresh</button>
        </div>
        <div class="table-wrap"><table><thead><tr><th>ID</th><th>Employee ID</th><th>Employee</th><th>Date</th><th>Status</th><th>Check in</th><th>Check out</th><th>Working time</th></tr></thead><tbody id="attendanceTableBody"><tr><td colspan="8">Loading…</td></tr></tbody></table></div>
    </section>
    <p><a href="/manager-dashboard">← Back to Manager Dashboard</a></p>
</div>
<script>
(() => {
 const $=id=>document.getElementById(id);let records=[],team=[];
 const timeMinutes=v=>{if(!v)return null;const p=String(v).split(":").map(Number);return p.length>=2?p[0]*60+p[1]:null};
 const duration=r=>{const a=timeMinutes(r.checkInTime),b=timeMinutes(r.checkOutTime);if(a===null||b===null)return "—";let m=b-a;if(m<0)m+=1440;return Math.floor(m/60)+"h "+m%60+"m"};
 function message(t,error=false){$("feedback").textContent=t;$("feedback").className=error?"error-message":"success-message"}
 async function api(url,options={}){const response=await fetch(url,{credentials:"same-origin",...options,headers:{"Accept":"application/json","Content-Type":"application/json",...(options.headers||{})}});const raw=await response.text();let data;try{data=raw?JSON.parse(raw):null}catch{data=raw}if(!response.ok)throw new Error(data?.error||data?.message||data||("Request failed (HTTP "+response.status+")"));return data}
 async function loadEmployees(){try{team=await api("/employees/manager/my-team")||[];const select=$("employeeId");select.replaceChildren(new Option(team.length?"Select employee":"No active team members",""));team.forEach(e=>select.add(new Option([e.firstName,e.lastName].filter(Boolean).join(" ")+" (ID "+e.employeeId+")",e.employeeId)));}catch(e){message("Unable to load team members: "+e.message,true)}}
 function filtered(){return records.filter(r=>(!$("fromDate").value||String(r.attDate||"")>=$("fromDate").value)&&(!$("toDate").value||String(r.attDate||"")<=$("toDate").value)&&(!$("statusFilter").value||String(r.status||"").toLowerCase()===$("statusFilter").value.toLowerCase()))}
 function render(){const rows=filtered(),body=$("attendanceTableBody");body.replaceChildren();$("recordCount").textContent=rows.length;$("presentCount").textContent=rows.filter(r=>String(r.status||"").toLowerCase()==="present").length;$("absentCount").textContent=rows.filter(r=>String(r.status||"").toLowerCase()==="absent").length;$("lateCount").textContent=rows.filter(r=>String(r.status||"").toLowerCase()==="late").length;if(!rows.length){const tr=document.createElement("tr"),td=document.createElement("td");td.colSpan=8;td.textContent="No attendance records match these filters.";tr.appendChild(td);body.appendChild(tr);return}rows.forEach(r=>{const tr=document.createElement("tr"),e=r.employee||{};[r.attendanceId,e.employeeId,[e.firstName,e.lastName].filter(Boolean).join(" ")||"—",r.attDate,r.status,r.checkInTime||"—",r.checkOutTime||"—",duration(r)].forEach(v=>{const td=document.createElement("td");td.textContent=v??"—";tr.appendChild(td)});body.appendChild(tr)})}
 async function load(){try{records=await api("/attendance/manager/team")||[];render()}catch(e){message("Unable to load team attendance: "+e.message,true)}}
 $("attendanceForm").addEventListener("submit",async ev=>{ev.preventDefault();const employeeId=Number($("employeeId").value),attDate=$("attDate").value,checkInTime=$("checkInTime").value,checkOutTime=$("checkOutTime").value;if(!employeeId||!attDate){message("Select an employee and date.",true);return}if(checkInTime&&checkOutTime&&checkOutTime<checkInTime){message("Check-out cannot be earlier than check-in.",true);return}const btn=$("saveButton");btn.disabled=true;try{await api("/attendance/manager",{method:"POST",body:JSON.stringify({employee:{employeeId},attDate,status:$("status").value,checkInTime:checkInTime||null,checkOutTime:checkOutTime||null})});message("Attendance saved.");$("attendanceForm").reset();await load()}catch(e){message("Could not save attendance: "+e.message,true)}finally{btn.disabled=false}});
 $("applyFilter").addEventListener("click",render);$("resetFilter").addEventListener("click",()=>{$("fromDate").value="";$("toDate").value="";$("statusFilter").value="";render()});$("refreshButton").addEventListener("click",load);
 $("exportButton").addEventListener("click",()=>{const rows=[["ID","Employee ID","Employee","Date","Status","Check in","Check out","Working time"],...filtered().map(r=>[r.attendanceId,r.employee?.employeeId,[r.employee?.firstName,r.employee?.lastName].filter(Boolean).join(" "),r.attDate,r.status,r.checkInTime,r.checkOutTime,duration(r)])];const csv=rows.map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}));a.download="team-attendance.csv";a.click();URL.revokeObjectURL(a.href)});
 loadEmployees();load();
})();
</script>

<script th:src="@{/theme.js}" defer></script>
</body>
</html>
