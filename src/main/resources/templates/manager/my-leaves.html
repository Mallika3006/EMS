<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Leaves - StaffSync</title>

    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
</head>

<body>

<div class="container">

    <h1>My Leaves</h1>


    <!-- =====================================================
         APPLY FOR LEAVE
         ===================================================== -->

    <div class="card">

        <h3>Apply for Leave</h3>

        <form id="leaveForm">

            <div>
                <label for="fromDate">From Date:</label>

                <input
                        type="date"
                        id="fromDate"
                        required>
            </div>

            <br>

            <div>
                <label for="toDate">To Date:</label>

                <input
                        type="date"
                        id="toDate"
                        required>
            </div>

            <br>

            <div>
                <label for="reason">Reason:</label>

                <textarea
                        id="reason"
                        rows="4"
                        placeholder="Enter reason for leave"
                        required></textarea>
            </div>

            <br>

            <button type="submit">
                Apply for Leave
            </button>

        </form>

        <p id="formMessage"></p>

    </div>


    <!-- =====================================================
         LEAVE RECORDS
         ===================================================== -->

    <div class="card" id="leaves">

        <p class="loading">
            Loading leaves...
        </p>

    </div>


    <br>

    <a class="back-link" href="/manager-dashboard">
        ← Back to Manager Dashboard
    </a>

</div>


<script>

    // =========================================================
    // SET MINIMUM DATE
    // Manager can apply only for future dates
    // =========================================================

    function setMinimumDate() {

        const tomorrow = new Date();

        tomorrow.setHours(0, 0, 0, 0);

        tomorrow.setDate(
            tomorrow.getDate() + 1
        );


        const year =
            tomorrow.getFullYear();

        const month =
            String(tomorrow.getMonth() + 1)
                .padStart(2, '0');

        const day =
            String(tomorrow.getDate())
                .padStart(2, '0');


        const minimumDate =
            `${year}-${month}-${day}`;


        document.getElementById("fromDate").min =
            minimumDate;

        document.getElementById("toDate").min =
            minimumDate;
    }


    // =========================================================
    // FROM DATE CHANGE
    // TO DATE CANNOT BE BEFORE FROM DATE
    // =========================================================

    document.getElementById("fromDate")
        .addEventListener("change", function () {

            const fromDate = this.value;

            const toDate =
                document.getElementById("toDate");


            if (fromDate) {

                toDate.min = fromDate;


                if (
                    toDate.value &&
                    toDate.value < fromDate
                ) {

                    toDate.value = "";

                }

            }

        });


    setMinimumDate();


    // =========================================================
    // CREATE LEAVE TABLE
    // =========================================================

    function createLeaveTable(
        leaves,
        showWithdrawButton
    ) {

        if (!leaves || leaves.length === 0) {

            return `
                <p class="empty-message">
                    No records found.
                </p>
            `;
        }


        let html = `

            <table>

                <thead>

                    <tr>

                        <th>From</th>
                        <th>To</th>
                        <th>Reason</th>
                        <th>Status</th>

                        ${
            showWithdrawButton
                ? "<th>Action</th>"
                : ""
        }

                    </tr>

                </thead>

                <tbody>

        `;


        leaves.forEach(leave => {

            html += `

                <tr>

                    <td>
                        ${leave.fromDate ?? "N/A"}
                    </td>

                    <td>
                        ${leave.toDate ?? "N/A"}
                    </td>

                    <td>
                        ${leave.reason ?? "N/A"}
                    </td>

                    <td>
                        ${leave.status ?? "N/A"}
                    </td>

            `;


            // =================================================
            // WITHDRAW BUTTON
            // Only pending leaves can be withdrawn
            // =================================================

            if (showWithdrawButton) {

                html += `

                    <td>

                        <button
                            type="button"
                            onclick="withdrawLeave(${leave.leaveId})">

                            Withdraw

                        </button>

                    </td>

                `;

            }


            html += `

                </tr>

            `;

        });


        html += `

                </tbody>

            </table>

        `;


        return html;
    }


    // =========================================================
    // LOAD MY LEAVES
    // =========================================================

    function loadLeaves() {

        fetch('/leaves/me')

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Failed to load leaves"
                    );

                }

                return response.json();

            })


            .then(leaveList => {

                const leavesDiv =
                    document.getElementById("leaves");


                // =================================================
                // NO RECORDS
                // =================================================

                if (
                    !leaveList ||
                    leaveList.length === 0
                ) {

                    leavesDiv.innerHTML = `

                        <h3>My Leave Records</h3>

                        <p class="empty-message">
                            No leave records found.
                        </p>

                    `;

                    return;
                }


                // =================================================
                // SEPARATE BY STATUS
                // =================================================

                const pendingLeaves =
                    leaveList.filter(leave =>

                        leave.status &&

                        leave.status.toLowerCase() === "pending"

                    );


                const approvedLeaves =
                    leaveList.filter(leave =>

                        leave.status &&

                        leave.status.toLowerCase() === "approved"

                    );


                const withdrawnLeaves =
                    leaveList.filter(leave =>

                        leave.status &&

                        leave.status.toLowerCase() === "withdrawn"

                    );


                const rejectedLeaves =
                    leaveList.filter(leave =>

                        leave.status &&

                        leave.status.toLowerCase() === "rejected"

                    );


                // =================================================
                // DISPLAY
                // =================================================

                leavesDiv.innerHTML = `

                    <h3>My Leave Records</h3>


                    <details>

                        <summary>
                            Pending (${pendingLeaves.length})
                        </summary>

                        ${createLeaveTable(
                    pendingLeaves,
                    true
                )}

                    </details>


                    <br>


                    <details>

                        <summary>
                            Approved (${approvedLeaves.length})
                        </summary>

                        ${createLeaveTable(
                    approvedLeaves,
                    false
                )}

                    </details>


                    <br>


                    <details>

                        <summary>
                            Withdrawn (${withdrawnLeaves.length})
                        </summary>

                        ${createLeaveTable(
                    withdrawnLeaves,
                    false
                )}

                    </details>


                    <br>


                    <details>

                        <summary>
                            Rejected (${rejectedLeaves.length})
                        </summary>

                        ${createLeaveTable(
                    rejectedLeaves,
                    false
                )}

                    </details>

                `;

            })


            // =====================================================
            // ERROR HANDLING
            // =====================================================

            .catch(error => {

                document.getElementById("leaves").innerHTML = `

                    <p class="error-message">
                        Unable to load leaves.
                    </p>

                `;

                console.error(error);

            });

    }


    // =========================================================
    // APPLY FOR LEAVE
    // =========================================================

    document.getElementById("leaveForm")
        .addEventListener("submit", function (event) {

            event.preventDefault();


            const fromDate =
                document.getElementById("fromDate").value;

            const toDate =
                document.getElementById("toDate").value;

            const reason =
                document.getElementById("reason")
                    .value.trim();

            const formMessage =
                document.getElementById("formMessage");


            // =================================================
            // DATE VALIDATION
            // =================================================

            const tomorrow = new Date();

            tomorrow.setHours(0, 0, 0, 0);

            tomorrow.setDate(
                tomorrow.getDate() + 1
            );


            const selectedFromDate =
                new Date(fromDate);

            const selectedToDate =
                new Date(toDate);


            if (selectedFromDate < tomorrow) {

                formMessage.innerText =
                    "From date must be an upcoming date.";

                return;
            }


            if (selectedToDate < tomorrow) {

                formMessage.innerText =
                    "To date must be an upcoming date.";

                return;
            }


            if (selectedToDate < selectedFromDate) {

                formMessage.innerText =
                    "To date must be on or after From date.";

                return;
            }


            if (reason === "") {

                formMessage.innerText =
                    "Please enter a reason.";

                return;
            }


            // =================================================
            // LEAVE REQUEST
            // Employee and status are handled by backend
            // =================================================

            const leave = {

                fromDate: fromDate,
                toDate: toDate,
                reason: reason

            };


            // =================================================
            // SEND REQUEST
            // =================================================

            fetch('/leaves', {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify(leave)

            })


                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Failed to apply for leave"
                        );

                    }

                    return response.json();

                })


                .then(() => {

                    formMessage.innerText =
                        "Leave applied successfully.";

                    document.getElementById(
                        "leaveForm"
                    ).reset();

                    setMinimumDate();

                    loadLeaves();

                })


                .catch(error => {

                    formMessage.innerText =
                        "Unable to apply for leave.";

                    console.error(error);

                });

        });


    // =========================================================
    // WITHDRAW LEAVE
    // =========================================================

    function withdrawLeave(leaveId) {

        if (!confirm(
            "Are you sure you want to withdraw this leave?"
        )) {

            return;

        }


        fetch(
            '/leaves/' + leaveId + '/withdraw',
            {
                method: 'PUT'
            }
        )


            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Failed to withdraw leave"
                    );

                }

                return response.json();

            })


            .then(() => {

                alert(
                    "Leave withdrawn successfully."
                );

                loadLeaves();

            })


            .catch(error => {

                alert(
                    "Unable to withdraw leave."
                );

                console.error(error);

            });

    }


    // =========================================================
    // INITIAL LOAD
    // =========================================================

    loadLeaves();

</script>

</body>

</html>
