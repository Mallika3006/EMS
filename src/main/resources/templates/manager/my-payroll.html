<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>My Payroll - StaffSync</title>

    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="icon"
          type="image/x-icon"
          th:href="@{/favicon.ico}">
</head>

<body>

<div class="container">

    <h1>My Payroll</h1>

    <div class="card" id="payroll">

        <p class="loading">
            Loading payroll...
        </p>

    </div>

    <br>

    <a class="back-link" href="/manager-dashboard">
        ← Back to Dashboard
    </a>

</div>


<script>

    // =========================================================
    // LOAD MY PAYROLL
    // =========================================================

    fetch('/payrolls/me')

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load payroll"
                );

            }

            return response.json();

        })


        .then(payrollList => {

            const payrollDiv =
                document.getElementById("payroll");


            // =====================================================
            // NO PAYROLL RECORDS
            // =====================================================

            if (
                !payrollList ||
                payrollList.length === 0
            ) {

                payrollDiv.innerHTML = `

                    <h3>Payroll Records</h3>

                    <p class="empty-message">
                        No payroll records found.
                    </p>

                `;

                return;
            }


            // =====================================================
            // PAYROLL TABLE
            // =====================================================

            let html = `

                <h3>Payroll Records</h3>

                <table>

                    <thead>

                        <tr>

                            <th>Pay Month</th>
                            <th>Basic Salary</th>
                            <th>Allowances</th>
                            <th>Deductions</th>
                            <th>Net Salary</th>
                            <th>Payment Date</th>

                        </tr>

                    </thead>

                    <tbody>

            `;


            payrollList.forEach(payroll => {

                html += `

                    <tr>

                        <td>
                            ${payroll.payMonth ?? "-"}
                        </td>

                        <td>
                            ₹${payroll.basicSalary ?? "0"}
                        </td>

                        <td>
                            ₹${payroll.allowances ?? "0"}
                        </td>

                        <td>
                            ₹${payroll.deductions ?? "0"}
                        </td>

                        <td>
                            ₹${payroll.netSalary ?? "0"}
                        </td>

                        <td>
                            ${payroll.paymentDate ?? "-"}
                        </td>

                    </tr>

                `;

            });


            html += `

                    </tbody>

                </table>

            `;


            payrollDiv.innerHTML = html;

        })


        // =========================================================
        // ERROR HANDLING
        // =========================================================

        .catch(error => {

            document.getElementById("payroll").innerHTML = `

                <p class="error-message">
                    Unable to load payroll.
                </p>

            `;

            console.error(error);

        });

</script>

</body>

</html>
