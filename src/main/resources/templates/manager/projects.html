<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Projects</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="container">

    <h1>Team Projects</h1>

    <p>Manage projects assigned to your team.</p>

    <button onclick="loadProjects()">
        Refresh
    </button>

    <button onclick="window.location.href='/manager-dashboard'">
        Back to Dashboard
    </button>

    <br><br>

    <table border="1" width="100%" cellpadding="10">

        <thead>
        <tr>
            <th>Project ID</th>
            <th>Project Name</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody id="projectTableBody">
        </tbody>

    </table>

</div>

<script>

    // Load projects assigned to the manager's team
    async function loadProjects() {

        const tableBody =
            document.getElementById("projectTableBody");

        try {

            const response =
                await fetch("/projects/manager/team");

            if (!response.ok) {
                throw new Error("Failed to fetch team projects");
            }

            const projects =
                await response.json();

            tableBody.innerHTML = "";

            if (projects.length === 0) {

                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            No projects assigned to your team.
                        </td>
                    </tr>
                `;

                return;
            }

            projects.forEach(project => {

                const row =
                    document.createElement("tr");

                row.innerHTML = `
                    <td>${project.projectId}</td>

                    <td>${project.projectName}</td>

                    <td>${project.startDate ?? "-"}</td>

                    <td>${project.endDate ?? "-"}</td>

                    <td>
                        <button
                            onclick="viewProjectTasks(${project.projectId})">
                            View Tasks
                        </button>

                        <button
                            onclick="editProject(${project.projectId})">
                            Edit
                        </button>

                        <button
                            onclick="deleteProject(${project.projectId})">
                            Delete
                        </button>
                    </td>
                `;

                tableBody.appendChild(row);

            });

        } catch (error) {

            console.error(error);

            tableBody.innerHTML = `
                <tr>
                    <td colspan="5">
                        Failed to load team projects.
                    </td>
                </tr>
            `;

            alert(error.message);
        }
    }


    // Open tasks for the selected project
    function viewProjectTasks(projectId) {

        window.location.href =
            "/manager/tasks?projectId=" + projectId;
    }


    // Open the project edit page
    function editProject(projectId) {

        window.location.href =
            "/manager/projects/edit?id=" + projectId;
    }


    // Delete a project
    async function deleteProject(projectId) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this project?"
            );

        if (!confirmed) {
            return;
        }

        try {

            const response =
                await fetch(
                    "/projects/" + projectId,
                    {
                        method: "DELETE"
                    }
                );

            if (!response.ok) {

                const errorText =
                    await response.text();

                throw new Error(
                    errorText || "Failed to delete project"
                );
            }

            alert("Project deleted successfully");

            await loadProjects();

        } catch (error) {

            console.error(error);

            alert(
                "Failed to delete project: " +
                error.message
            );
        }
    }


    // Load projects when the page opens
    loadProjects();

</script>

</body>
</html>
