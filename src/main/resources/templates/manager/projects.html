<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assigned Projects | Employee Management System</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="container">

    <h1>Assigned Projects</h1>

    <p>View projects associated with your manager account and assign them to permitted employees.</p>

    <button onclick="loadProjects()">
        Refresh
    </button>

    <button onclick="window.location.href='/manager-dashboard'">
        Back to Dashboard
    </button>

    <br><br>

    <table border="1" width="100%" cellpadding="10">

        <thead>
        <tr>
            <th>Project ID</th>
            <th>Project Name</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Progress</th>
            <th>Tasks</th>
            <th>Assigned Members</th>
            <th>Assign Member</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody id="projectTableBody">
        </tbody>

    </table>

</div>

<script>

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, character => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[character]);
    }

    // Load only projects assigned to the current manager.
    async function loadProjects() {

        const tableBody =
            document.getElementById("projectTableBody");

        try {

            const response =
                await fetch("/projects/manager/team", { credentials: "same-origin" });

            if (!response.ok) {
                throw new Error("Failed to fetch manager projects");
            }

            const projects = await response.json();

            const reportsResponse = await fetch("/employees/manager/my-team");
            if (!reportsResponse.ok) {
                throw new Error("Failed to load your direct reports");
            }
            const employees = await reportsResponse.json();

            tableBody.innerHTML = "";

            if (projects.length === 0) {

                tableBody.innerHTML = `
                    <tr>
                        <td colspan="11">
                            No projects are currently available for your account.
                        </td>
                    </tr>
                `;

                return;
            }

            projects.forEach(project => {

                const row =
                    document.createElement("tr");

                row.innerHTML = `
                    <td>${project.projectId}</td>
                    <td>${escapeHtml(project.projectName || "-")}</td>
                    <td>${project.startDate ?? "-"}</td>
                    <td>${project.endDate ?? "-"}</td>
                    <td>${escapeHtml(project.status || "PLANNED")}</td>
                    <td>${escapeHtml(project.priority || "MEDIUM")}</td>
                    <td>${Number(project.progressPercent ?? 0)}%</td>
                    <td>${Number(project.completedTasks ?? 0)} / ${Number(project.totalTasks ?? 0)}</td>
                    <td>
                        ${Number(project.assignedEmployeeCount ?? 0)}
                        <button type="button" onclick="viewProjectMembers(${project.projectId})">View members</button>
                    </td>
                    <td>
                        <select id="project-member-${project.projectId}">
                            <option value="">Select employee</option>
                        </select>
                        <button onclick="assignProjectMember(${project.projectId})">Assign</button>
                    </td>
                    <td>
                        <button onclick="viewProjectTasks(${project.projectId})">View Tasks</button>
                    </td>
                `;

                tableBody.appendChild(row);

                const memberSelect = document.getElementById(
                    "project-member-" + project.projectId
                );
                employees.forEach(member => {
                    const option = document.createElement("option");
                    option.value = String(member.employeeId);
                    option.textContent =
                        (member.firstName ?? "") + " " +
                        (member.lastName ?? "") +
                        " (ID: " + member.employeeId + ")";
                    memberSelect.appendChild(option);
                });

            });

        } catch (error) {

            console.error(error);

            tableBody.innerHTML = `
                <tr>
                    <td colspan="11">
                        Unable to load projects. Check your access and try again.
                    </td>
                </tr>
            `;

            alert(error.message);
        }
    }


    // Assign this manager-owned project to one of the manager's active direct reports.
    async function assignProjectMember(projectId) {
        const select = document.getElementById("project-member-" + projectId);
        const employeeId = select ? select.value : "";
        if (!employeeId) {
            alert("Select a employee first.");
            return;
        }

        try {
            const response = await fetch(
                "/projects/" + projectId + "/members/" + employeeId,
                { method: "POST", credentials: "same-origin" }
            );
            if (!response.ok) {
                throw new Error(
                    (await response.text()) || "Project assignment failed"
                );
            }
            alert("Project assigned to employee.");
            await loadProjects();
        } catch (error) {
            alert("Could not assign project: " + error.message);
        }
    }


    async function viewProjectMembers(projectId) {
        try {
            const response = await fetch("/projects/" + projectId + "/members", {
                credentials: "same-origin"
            });
            if (!response.ok) {
                throw new Error((await response.text()) || "Could not load project members");
            }
            const members = await response.json();
            const message = members.length
                ? members.map(member => {
                    const name = [member.firstName, member.lastName].filter(Boolean).join(" ") || "Name unavailable";
                    return name + " (ID: " + member.employeeId + ")";
                }).join("\n")
                : "No active employees are assigned to this project.";
            alert("Project members\n\n" + message);
        } catch (error) {
            alert("Could not load project members: " + error.message);
        }
    }

    // Open tasks for the selected project
    function viewProjectTasks(projectId) {

        window.location.href =
            "/manager/tasks?projectId=" + projectId;
    }


    // Open the project edit page
    function editProject(projectId) {

        window.location.href =
            "/manager/projects/edit?id=" + projectId;
    }


    // Delete a project
    async function deleteProject(projectId) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this project?"
            );

        if (!confirmed) {
            return;
        }

        try {

            const response =
                await fetch(
                    "/projects/" + projectId,
                    {
                        method: "DELETE"
                    }
                );

            if (!response.ok) {

                const errorText =
                    await response.text();

                throw new Error(
                    errorText || "Failed to delete project"
                );
            }

            alert("Project deleted successfully");

            await loadProjects();

        } catch (error) {

            console.error(error);

            alert(
                "Failed to delete project: " +
                error.message
            );
        }
    }


    // Load projects when the page opens
    loadProjects();

</script>

</body>
</html>
