<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Team - StaffSync</title>

    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
</head>

<body>

<div class="container">

    <h1>My Team</h1>

    <p>View the active employees assigned to you.</p>

    <hr>

    <div id="teamContainer">
        <p class="loading">Loading team members...</p>
    </div>

    <br>

    <a class="back-link" href="/manager-dashboard">
        ← Back to Manager Dashboard
    </a>

</div>

<script>

    // ==========================================
    // LOAD ACTIVE TEAM MEMBERS
    // ==========================================

    async function loadMyTeam() {

        const container =
            document.getElementById("teamContainer");

        container.innerHTML =
            "<p class='loading'>Loading team members...</p>";

        try {

            // This endpoint identifies the logged-in manager
            // and loads employees assigned to that manager.
            const response =
                await fetch("/employees/manager/my-team");

            if (!response.ok) {
                throw new Error("Failed to load team members");
            }

            const employees = await response.json();

            if (!Array.isArray(employees) || employees.length === 0) {

                container.innerHTML =
                    "<p>No active team members found.</p>";

                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Employee ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Department</th>
                            <th>Designation</th>
                        </tr>
                    </thead>

                    <tbody>
            `;

            employees.forEach(employee => {

                const departmentName =
                    employee.department?.departmentName ?? "-";

                const designationName =
                    employee.designation?.designationTitle ?? "-";

                html += `
                    <tr>
                        <td>${employee.employeeId ?? "-"}</td>
                        <td>${employee.firstName ?? "-"}</td>
                        <td>${employee.lastName ?? "-"}</td>
                        <td>${employee.email ?? "-"}</td>
                        <td>${employee.phone ?? "-"}</td>
                        <td>${departmentName}</td>
                        <td>${designationName}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;

        } catch (error) {

            console.error("Error loading team members:", error);

            container.innerHTML = `
                <p class="error-message">
                    Unable to load team members. Please refresh and try again.
                </p>
            `;
        }
    }

    // ==========================================
    // INITIAL LOAD
    // ==========================================

    loadMyTeam();

</script>

</body>
</html>
